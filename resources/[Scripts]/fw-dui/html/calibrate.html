<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
    body {
        box-sizing: border-box; border: 1.2vh solid #ff00ff;
        background: #111 repeating-linear-gradient(0deg, transparent 0 9.5%, #444 9.5% 10%),
                    repeating-linear-gradient(90deg, transparent 0 9.5%, #444 9.5% 10%);
        display: flex; align-items: center; justify-content: center;
        font: 700 8vh Arial, sans-serif; color: #fff;
    }
    i { position: absolute; width: 8vh; height: 8vh; background: #ff00ff; }
    .tl { top: 0; left: 0; } .tr { top: 0; right: 0; background: #00ffff; } .bl { bottom: 0; left: 0; background: #ffff00; }
</style>
</head>
<body><i class="tl"></i><i class="tr"></i><i class="bl"></i>1 TL · 2 TR · 3 BL</body>
</html>
