<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
    body { background: linear-gradient(135deg, #0f1115, #1c2030); color: #e8eaf0; font-family: 'Segoe UI', Arial, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    h1 { font-size: 11vh; margin: 0 0 3vh; }
    p { font-size: 5.5vh; margin: 0; opacity: .7; }
    #clock { position: absolute; bottom: 4vh; right: 4vw; font-size: 5vh; opacity: .5; }
</style>
</head>
<body>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div id="clock"></div>
<script>
    const set = (id, v) => document.getElementById(id).textContent = v == null ? '' : String(v);
    const tick = () => set('clock', new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    tick(); setInterval(tick, 10000);

    window.addEventListener('message', e => {
        let m = e.data;
        if (typeof m === 'string') try { m = JSON.parse(m); } catch { return; }
        if (m && m.action === 'data') { set('title', m.data.Title); set('text', m.data.Text); }
    });
</script>
</body>
</html>
