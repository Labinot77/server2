<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop</title>
<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.4/css/all.css">
<style>
    /* --s scales the desktop: menu bar, dock, title bars, hints, cursor */
    :root { --s: 1.35; --bar: calc(26px * var(--s)); }
    .menubar, .dock, .hints, .titlebar, .empty { zoom: var(--s); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; cursor: none; user-select: none; }
    body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1d1f24;
        background: radial-gradient(ellipse at 25% 20%, #d3e7f5 0%, transparent 45%),
                    radial-gradient(ellipse at 70% 80%, #5d93c4 0%, transparent 55%),
                    linear-gradient(160deg, #a9cde8 0%, #78aad6 45%, #4f86bd 100%);
    }

    /* Menu bar */
    .menubar {
        position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 50;
        display: flex; align-items: center; gap: 16px; padding: 0 14px;
        background: rgba(245, 247, 250, 0.92); /* no backdrop-filter: it can render a DUI black */
        font-size: 13px; font-weight: 500;
    }
    .menubar .logo { font-size: 14px; }
    .menubar b { font-weight: 700; }
    .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }

    /* Dock */
    .dock {
        position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 40;
        display: flex; gap: 10px; padding: 8px 10px;
        background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 18px;
    }
    .app { position: relative; width: 52px; height: 52px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
           font-size: 24px; color: white; box-shadow: 0 2px 6px rgba(0,0,0,0.25); transition: transform 0.12s ease; }
    .app:hover { transform: translateY(-6px) scale(1.08); }
    .app .tip { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); white-space: nowrap; display: none;
                padding: 3px 9px; border-radius: 6px; font-size: 12px; color: #1d1f24; background: rgba(245,247,250,0.92); }
    .app:hover .tip { display: block; }
    .app .dot { position: absolute; bottom: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #1d1f24; display: none; }
    .app.open .dot { display: block; }
    .trash { background: rgba(255,255,255,0.55); color: #6b7280; }

    /* Windows */
    .window {
        position: absolute; display: flex; flex-direction: column; overflow: hidden; z-index: 10;
        border-radius: 10px; background: #1b1d22; box-shadow: 0 18px 50px rgba(0,0,0,0.45);
        animation: pop 0.16s ease-out;
    }
    .window.hidden { display: none; }
    .window.max { left: 0 !important; top: var(--bar) !important; width: 100% !important; height: calc(100% - var(--bar)) !important; border-radius: 0; }
    .titlebar { position: relative; height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px;
                background: #e9eaee; font-size: 13px; font-weight: 600; color: #3a3d44; }
    .titlebar .title { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
    .light { position: relative; z-index: 1; width: 13px; height: 13px; border-radius: 50%; }
    .light.red { background: #ff5f57; } .light.yellow { background: #febc2e; } .light.green { background: #28c840; }
    .window iframe { flex: 1; width: 100%; border: 0; background: #0d0f12; }
    @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Hints */
    .hints { position: absolute; right: 14px; bottom: 16px; z-index: 30; display: flex; gap: 14px; align-items: center;
             padding: 7px 12px; border-radius: 6px; background: rgba(30, 41, 59, 0.85); color: white; font-size: 11px; font-weight: 700; }
    .hints span { display: flex; align-items: center; gap: 6px; }
    .key { min-width: 22px; height: 18px; padding: 0 4px; border-radius: 3px; background: white; color: #1e293b;
           display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }

    .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85);
             font-size: 22px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.3); pointer-events: none; }

    .cursor { position: absolute; top: 0; left: 0; width: calc(22px * var(--s)); height: calc(22px * var(--s)); z-index: 1000; pointer-events: none; display: none;
              filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8)); }
    .hidden { display: none !important; }
</style>
</head>
<body>
    <div class="menubar">
        <i class="fas fa-layer-group logo"></i>
        <b id="active">Finder</b><span>File</span><span>Edit</span><span>View</span><span>Settings</span><span>Window</span><span>Help</span>
        <div class="right"><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i><i class="fas fa-volume-up"></i><span id="clock"></span></div>
    </div>

    <div class="empty hidden" id="empty">No apps on this computer</div>
    <div id="windows"></div>
    <div class="dock" id="dock"></div>

    <div class="hints">
        <span><span class="key"><i class="fas fa-mouse"></i></span>NAVIGATE</span>
        <span><span class="key"><i class="fas fa-mouse-pointer"></i></span>OPEN</span>
        <span><span class="key">ESC</span>CLOSE</span>
    </div>

    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11.5 22 L14.5 20.6 L11 13.3 L17.5 13.3 Z" fill="white" stroke="#0b0d10" stroke-width="1.4" stroke-linejoin="round"/></svg>

<script>
    // Apps: { id, label, icon (Font Awesome class), color, url, width, height (percent of the screen) }
    // Every app runs in its own iframe, created when the apps are set, so it keeps its state (and live data)
    // while its window is closed. Messages for an app are forwarded to it as { action, data }.
    const $ = id => document.getElementById(id);
    const Apps = {};     // [id] = { app, win, frame, ready, queue }
    let Order = [], Top = 10, Signature = "";

    const Esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const ToApp = (Id, Message) => {
        const A = Apps[Id];
        if (!A) return;
        if (A.ready) A.frame.contentWindow.postMessage(Message, "*");
        else A.queue.push(Message);
    };

    const SetActive = () => {
        const Open = Order.filter(Id => !Apps[Id].win.classList.contains("hidden"));
        const Front = Open.sort((A, B) => Apps[B].win.style.zIndex - Apps[A].win.style.zIndex)[0];
        $("active").textContent = Front ? Apps[Front].app.label : "Finder";
        Order.forEach(Id => Apps[Id].icon.classList.toggle("open", !Apps[Id].win.classList.contains("hidden")));
    };

    const Focus = Id => { Apps[Id].win.style.zIndex = ++Top; SetActive(); };
    const Open = Id => { if (!Apps[Id]) return; Apps[Id].win.classList.remove("hidden"); Focus(Id); };
    const Close = Id => { if (!Apps[Id]) return; Apps[Id].win.classList.add("hidden"); SetActive(); };

    const Build = List => {
        $("windows").innerHTML = "";
        $("dock").innerHTML = "";
        for (const Id in Apps) delete Apps[Id];
        Order = List.map(A => A.id);

        for (const App of List) {
            const W = App.width || 96, H = App.height || 79;
            const Win = document.createElement("div");
            Win.className = "window hidden";
            Win.style.cssText = `left:${(100 - W) / 2}%;top:calc(var(--bar) + 1%);width:${W}%;height:${H}%;`;
            Win.innerHTML = `<div class="titlebar"><div class="light red" data-close></div><div class="light yellow" data-min></div><div class="light green" data-max></div><div class="title">${Esc(App.label)}</div></div>`;

            const Frame = document.createElement("iframe");
            Win.appendChild(Frame);
            $("windows").appendChild(Win);

            const Icon = document.createElement("div");
            Icon.className = "app";
            Icon.style.background = App.color || "linear-gradient(160deg, #ffa53a, #f47a17)";
            Icon.innerHTML = `<i class="${Esc(App.icon || "fas fa-window-maximize")}"></i><div class="tip">${Esc(App.label)}</div><div class="dot"></div>`;
            $("dock").appendChild(Icon);

            const A = { app: App, win: Win, frame: Frame, icon: Icon, ready: false, queue: [] };
            Apps[App.id] = A;

            Frame.addEventListener("load", () => {
                A.ready = true;
                A.queue.splice(0).forEach(M => Frame.contentWindow.postMessage(M, "*"));
            });
            Frame.src = App.url;

            Icon.addEventListener("click", () => Open(App.id));
            Win.addEventListener("mousedown", () => Focus(App.id));
            Win.querySelector("[data-close]").addEventListener("click", E => { E.stopPropagation(); Close(App.id); });
            Win.querySelector("[data-min]").addEventListener("click", E => { E.stopPropagation(); Close(App.id); });
            Win.querySelector("[data-max]").addEventListener("click", () => Win.classList.toggle("max"));
        }

        const Trash = document.createElement("div");
        Trash.className = "app trash";
        Trash.innerHTML = `<i class="fas fa-trash"></i><div class="tip">Trash</div>`;
        $("dock").appendChild(Trash);

        $("empty").classList.toggle("hidden", List.length > 0);
        SetActive();
    };

    window.addEventListener("message", E => {
        let Msg = E.data;
        if (typeof Msg === "string") { try { Msg = JSON.parse(Msg); } catch { return; } }
        if (!Msg || !Msg.action) return;
        const D = Msg.data || {};

        switch (Msg.action) {
            case "desktop:setup": {
                // Same apps again (e.g. idle screen re-sent): keep the running apps and their state.
                const List = D.apps || [];
                const Sig = JSON.stringify(List.map(A => [A.id, A.url]));
                if (Sig !== Signature) { Signature = Sig; Build(List); }
                Order.forEach(Close); // back to the plain desktop, an app only opens when asked
                if (D.open) Open(D.open);
                break;
            }
            case "desktop:app": ToApp(D.id, { action: D.action, data: D.data }); break;
            case "desktop:open": Open(D.id); break;
            case "dui:key": { // typing (fw-dui cl_keys.lua): to the app in front
                const Front = Order.filter(Id => !Apps[Id].win.classList.contains("hidden")).sort((A, B) => Apps[B].win.style.zIndex - Apps[A].win.style.zIndex)[0];
                if (Front) ToApp(Front, Msg);
                break;
            }
            case "desktop:close": Close(D.id); break;
            case "desktop:cursor": {
                const C = $("cursor");
                C.style.display = D.visible === false ? "none" : "block";
                if (D.x !== undefined) C.style.transform = `translate(calc(${D.x}vw - 3px), calc(${D.y}vh - 2px))`;
                break;
            }
        }
    });

    const Tick = () => {
        const D = new Date();
        const Day = D.toLocaleDateString("en-US", { weekday: "short" });
        $("clock").textContent = `${Day} ${D.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}`;
    };
    setInterval(Tick, 10000);
    Tick();

    // Browser preview: open html/desktop/index.html?mock
    if (location.search.includes("mock")) {
        window.postMessage({ action: "desktop:setup", data: { apps: [
            { id: "demo", label: "Demo App", icon: "fas fa-car-mechanic", url: "about:blank" },
        ], open: "demo" } }, "*");
    }
</script>
</body>
</html>
