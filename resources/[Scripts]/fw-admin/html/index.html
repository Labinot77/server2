<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FW Admin</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="./css/sementicui-transition.css" />
<link rel="stylesheet" href="./css/sementicui-dropdown.css" />
<link rel="stylesheet" href="./css/main.css" />
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="./js/sementicui-transition.js"></script>
<script src="./js/sementicui-dropdown.js"></script>
</head>
<body>

  <div id="app" class="hidden">
    <div class="frame">

      <header class="titlebar">
        <div class="titlebar__text">
          <h1>ADMIN</h1>
          <span id="viewLabel">ALL COMMANDS</span>
        </div>
        <div class="titlebar__actions">
          <button class="chip" id="btnCloak" title="Toggle cloak (invisible)">CLOAK</button>
          <button class="chip is-active" id="btnFocus" title="When off, you can move while the menu is open">FULL FOCUS</button>
          <button class="chip" id="btnResetFavs" title="Remove all favourites">RESET FAVOURITES</button>
        </div>
      </header>

      <div class="body-row">
        <aside class="sidebar">
          <button class="nav-item is-active" data-view="commands" data-cat="all">
            <span class="nav-item__icon">
              <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="2" fill="currentColor"/><path d="M5 8.2l4.2 3.6L5 15.4" fill="none" stroke="var(--icon-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.2 16.2h6" fill="none" stroke="var(--icon-ink)" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            <span>ALL</span>
          </button>
          <button class="nav-item" data-view="commands" data-cat="player">
            <span class="nav-item__icon">
              <svg viewBox="0 0 448 512" fill="currentColor"><path d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0 96 57.3 96 128s57.3 128 128 128zm89.6 32h-16.7c-22.2 10.2-46.9 16-72.9 16s-50.6-5.8-72.9-16h-16.7C60.2 288 0 348.2 0 422.4V464c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48v-41.6c0-74.2-60.2-134.4-134.4-134.4z"/></svg>
            </span>
            <span>PLAYER</span>
          </button>
          <button class="nav-item" data-view="commands" data-cat="utility">
            <span class="nav-item__icon">
              <svg viewBox="0 0 512 512" fill="currentColor"><path d="M487.4 315.7l-42.6-24.6c4.3-23.2 4.3-47 0-70.2l42.6-24.6c4.9-2.8 7.1-8.6 5.5-14-11.1-35.6-30-67.8-54.7-94.6-3.8-4.1-10-5.1-14.8-2.3L380.8 110c-17.9-15.4-38.5-27.3-60.8-35.1V25.8c0-5.6-3.9-10.5-9.4-11.7-36.7-8.2-74.3-7.8-109.2 0-5.5 1.2-9.4 6.1-9.4 11.7V75c-22.2 7.9-42.8 19.8-60.8 35.1L88.7 85.5c-4.9-2.8-11-1.9-14.8 2.3-24.7 26.7-43.6 58.9-54.7 94.6-1.7 5.4.6 11.2 5.5 14L67.3 221c-4.3 23.2-4.3 47 0 70.2l-42.6 24.6c-4.9 2.8-7.1 8.6-5.5 14 11.1 35.6 30 67.8 54.7 94.6 3.8 4.1 10 5.1 14.8 2.3l42.6-24.6c17.9 15.4 38.5 27.3 60.8 35.1v49.2c0 5.6 3.9 10.5 9.4 11.7 36.7 8.2 74.3 7.8 109.2 0 5.5-1.2 9.4-6.1 9.4-11.7v-49.2c22.2-7.9 42.8-19.8 60.8-35.1l42.6 24.6c4.9 2.8 11 1.9 14.8-2.3 24.7-26.7 43.6-58.9 54.7-94.6 1.5-5.5-.7-11.3-5.6-14.1zM256 336c-44.1 0-80-35.9-80-80s35.9-80 80-80 80 35.9 80 80-35.9 80-80 80z"/></svg>
            </span>
            <span>UTILITY</span>
          </button>
          <button class="nav-item" data-view="commands" data-cat="user">
            <span class="nav-item__icon">
              <svg viewBox="0 0 640 512" fill="currentColor"><path d="M96 224c35.3 0 64-28.7 64-64s-28.7-64-64-64-64 28.7-64 64 28.7 64 64 64zm448 0c35.3 0 64-28.7 64-64s-28.7-64-64-64-64 28.7-64 64 28.7 64 64 64zm32 32h-64c-17.6 0-33.5 7.1-45.1 18.6 40.3 22.1 68.9 62 75.1 109.4h66c17.7 0 32-14.3 32-32v-32c0-35.3-28.7-64-64-64zm-256 0c61.9 0 112-50.1 112-112S381.9 32 320 32 208 82.1 208 144s50.1 112 112 112zm76.8 32h-8.3c-20.8 10-43.9 16-68.5 16s-47.6-6-68.5-16h-8.3C179.6 288 128 339.6 128 403.2V432c0 26.5 21.5 48 48 48h288c26.5 0 48-21.5 48-48v-28.8c0-63.6-51.6-115.2-115.2-115.2zm-223.7-13.4C161.5 263.1 145.6 256 128 256H64c-35.3 0-64 28.7-64 64v32c0 17.7 14.3 32 32 32h65.9c6.3-47.4 34.9-87.3 75.2-109.4z"/></svg>
            </span>
            <span>USER</span>
          </button>
          <button class="nav-item" data-view="commands" data-cat="fun">
            <span class="nav-item__icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 1.5L4 13.5h6.5L9 22.5l10-12.5h-6.5z"/></svg>
            </span>
            <span>FUN</span>
          </button>

          <div class="nav-sep"></div>

          <button class="nav-item" data-view="players">
            <span class="nav-item__icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="3.5" width="4" height="4" rx="1"/><rect x="8" y="4.5" width="14" height="2" rx="1"/><rect x="2" y="10" width="4" height="4" rx="1"/><rect x="8" y="11" width="14" height="2" rx="1"/><rect x="2" y="16.5" width="4" height="4" rx="1"/><rect x="8" y="17.5" width="14" height="2" rx="1"/></svg>
            </span>
            <span>PLAYERS</span>
          </button>
          <button class="nav-item" data-view="settings">
            <span class="nav-item__icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="4" width="20" height="2" rx="1"/><rect x="2" y="11" width="20" height="2" rx="1"/><rect x="2" y="18" width="20" height="2" rx="1"/><circle cx="8" cy="5" r="2.6"/><circle cx="16" cy="12" r="2.6"/><circle cx="10" cy="19" r="2.6"/></svg>
            </span>
            <span>SETTINGS</span>
          </button>
        </aside>

        <main class="main">
          <div class="searchbar">
            <input id="search" type="text" placeholder="Search commands..." autocomplete="off" />
          </div>
          <div class="countline"><span id="count">0</span> <span id="countUnit">COMMANDS</span></div>

          <div class="list" id="list"></div>
        </main>
      </div>

      <footer class="footbar">
        <div class="footbar__hints">
          <div class="hint"><span class="key">/</span> SEARCH</div>
          <div class="hint"><span class="key">&uarr;&darr;</span> MOVE</div>
          <div class="hint"><span class="key">&#9166;</span> SELECT</div>
          <div class="hint"><span class="key">F</span> FAVOURITE</div>
          <div class="hint"><span class="key">Q</span> CATEGORY</div>
          <div class="hint"><span class="key">ESC</span> CLOSE</div>
        </div>
      </footer>

    </div>
  </div>

<script src="./js/main.js"></script>
</body>
</html>
