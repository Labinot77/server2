<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Management</title>
<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.4/css/all.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Roboto+Mono:wght@500&display=swap">
<style>
    :root {
        --accent: #3fd8e6; --ink: #0b0d10; --bg: #0d0f12; --panel: #15181d; --panel-2: #1c2027;
        --line: rgba(255, 255, 255, 0.07); --muted: #8d949d; --ok: #5ee08a; --bad: #ef5a5a; --warn: #f2c14e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: white;
                 font-family: "Barlow Semi Condensed", sans-serif; user-select: none; cursor: none; }
    .italic { font-style: italic; text-transform: uppercase; font-weight: 800; }
    .mono { font-family: "Roboto Mono", monospace; }

    .topbar { display: flex; align-items: center; height: 56px; padding: 0 22px; border-bottom: 2px solid var(--accent);
              background: linear-gradient(90deg, #111418, #0d0f12); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand i { font-size: 22px; color: var(--accent); }
    .brand .title { font-size: 22px; line-height: 1; }
    .brand .sub { font-size: 13px; color: var(--muted); font-weight: 600; font-style: italic; text-transform: uppercase; }
    .stats { margin-left: auto; display: flex; align-items: center; gap: 22px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .stats b { color: white; }
    .stats .money { color: var(--accent); font-size: 18px; }
    .icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); color: var(--muted); }
    .icon-btn:hover { background: var(--accent); color: var(--ink); border-color: var(--accent); }

    .tabs { display: flex; gap: 6px; padding: 12px 22px 0; border-bottom: 1px solid var(--line); }
    .tab { padding: 8px 14px 10px; font-size: 15px; color: var(--muted); border-bottom: 3px solid transparent; }
    .tab:hover { color: white; }
    .tab.active { color: white; border-color: var(--accent); }

    .body { display: flex; height: calc(100vh - 56px - 47px); }
    .list { width: 380px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .list-head p { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .rows { flex: 1; overflow-y: auto; padding: 8px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; margin-bottom: 6px; background: var(--panel-2); border-left: 3px solid transparent; }
    .row:hover { background: #232832; }
    .row.selected { border-color: var(--accent); background: #1d2a30; }
    .row .name { font-size: 17px; font-weight: 700; flex: 1; }
    .row .meta { font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5058; }
    .dot.on { background: var(--ok); }

    .chip { display: inline-block; padding: 3px 9px; font-size: 13px; font-weight: 700; background: #2a2f38; color: #d7dbe0; }
    .chip.accent { background: var(--accent); color: var(--ink); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips .chip { padding: 7px 12px; font-size: 14px; }
    .chips .chip:hover { background: #3a414c; }
    .chips .chip.accent:hover { background: var(--accent); }

    .detail { flex: 1; overflow-y: auto; padding: 24px 28px; }
    .detail h1 { font-size: 34px; line-height: 1; }
    .detail .subtitle { margin-top: 6px; color: var(--muted); font-size: 15px; font-weight: 600; }
    .section { margin-top: 24px; }
    .section-title { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 14px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; font-size: 15px; font-weight: 800; font-style: italic;
           text-transform: uppercase; background: var(--accent); color: var(--ink); }
    .btn:hover { filter: brightness(1.1); }
    .btn.ghost { background: transparent; color: white; border: 1px solid var(--line); }
    .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn.danger { background: var(--bad); color: white; }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .toggles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .toggle { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; background: var(--panel-2); font-size: 15px; font-weight: 600; }
    .toggle.editable:hover { background: #232832; }
    .switch { width: 38px; height: 20px; border-radius: 10px; background: #3a3f48; position: relative; transition: background 0.12s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; transition: left 0.12s; }
    .switch.on { background: var(--accent); }
    .switch.on::after { left: 21px; }

    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card { padding: 20px; background: var(--panel-2); }
    .card i { font-size: 26px; color: var(--accent); }
    .card h3 { margin: 10px 0 6px; font-size: 22px; }
    .card p { margin-bottom: 16px; color: var(--muted); font-size: 15px; font-weight: 500; }
    .balance { font-size: 46px; color: var(--accent); }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--muted); text-align: center; }
    .empty i { font-size: 40px; }
    .note { color: var(--muted); font-size: 14px; font-weight: 500; }

    .lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--bg); z-index: 50; }
    .lock i { font-size: 56px; color: var(--accent); }
    .lock p { font-size: 28px; }
    .lock span { font-size: 15px; color: var(--muted); font-weight: 700; font-style: italic; text-transform: uppercase; }

    .toast { position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 20px; font-size: 16px; font-weight: 700;
             background: var(--accent); color: var(--ink); opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 60; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--bad); color: white; }

    .modal { position: absolute; inset: 0; z-index: 55; display: flex; align-items: center; justify-content: center; background: rgba(5, 6, 8, 0.75); }
    .modal form { width: 420px; padding: 22px; background: var(--panel); border-top: 2px solid var(--accent); display: flex; flex-direction: column; gap: 12px; }
    .modal h3 { font-size: 22px; }
    .modal label { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .modal input { width: 100%; margin-top: 4px; padding: 10px 12px; font: 600 17px "Barlow Semi Condensed", sans-serif; color: white;
                   background: var(--panel-2); border: 1px solid var(--line); outline: 0; cursor: none; }
    .modal input:focus { border-color: var(--accent); }
    .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .modal .row { background: none; padding: 0; border: 0; }
    .modal button.btn { border: 0; cursor: none; font: italic 800 16px "Barlow Semi Condensed", sans-serif; text-transform: uppercase; }
    .modal input::-webkit-inner-spin-button { display: none; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(63, 216, 230, 0.5); }
    .hidden { display: none !important; }
</style>
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <i class="fas fa-briefcase"></i>
            <div><p class="title italic" id="brand">Business</p><p class="sub">Management</p></div>
        </div>
        <div class="stats">
            <p>Owner: <b id="owner">-</b></p>
            <p>Your role: <b id="myRole">-</b></p>
            <p class="money mono" id="balance"></p>
            <div class="icon-btn" data-act="refresh" title="Refresh"><i class="fas fa-sync-alt"></i></div>
        </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="body"></div>

    <div class="lock" id="lock"><i class="fas fa-lock"></i><p class="italic">Management</p><span id="lockText">Use the laptop to manage the business</span></div>
    <div class="toast" id="toast"></div>
    <div class="modal hidden" id="modal"><form id="form"></form></div>

<script>
    const PERM_LABELS = {
        Hire: "Hire", Fire: "Fire", ChangeRole: "Change roles", PayEmployee: "Pay employees", PayExternal: "Pay others",
        ChargeExternal: "Charge customers", PropertyKeys: "Property keys", StashAccess: "Stash access", CraftAccess: "Craft access", VehicleSales: "Vehicle sales",
        Balance: "View balance", Deposit: "Deposit", Withdraw: "Withdraw", Transfer: "Transfer", Transactions: "Transactions",
    };

    const S = { view: null, tab: "employees", employee: null, role: null, hiring: false, confirm: null, bank: null, mock: location.search.includes("mock") };
    const $ = id => document.getElementById(id);
    const Esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const Money = v => "$" + Math.round(v || 0).toLocaleString("en-US");
    const Can = P => S.view && S.view.Perms && S.view.Perms[P];

    // Page -> client (fw-bennys handles it). Typed values come from the form below (fw-dui keyboard).
    const Post = (Action, Data = {}) => {
        if (S.mock) return;
        fetch("https://fw-bennys/management", { method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: JSON.stringify({ Action, ...Data }) });
    };

    let ToastTimer;
    const Toast = (Text, Type) => {
        const El = $("toast");
        El.textContent = Text;
        El.className = `toast show ${Type === "error" ? "error" : ""}`;
        clearTimeout(ToastTimer);
        ToastTimer = setTimeout(() => (El.className = "toast"), 2600);
    };

    const Toggle = (Label, On, Data, Editable) =>
        `<div class="toggle ${Editable ? "editable" : ""}" ${Editable ? Data : ""}><span>${Esc(Label)}</span><div class="switch ${On ? "on" : ""}"></div></div>`;

    // ── Render ──────────────────────────────────────────────────────────────

    const RenderTabs = () => {
        const Tabs = [["employees", "Employees", "fas fa-users"], ["roles", "Roles", "fas fa-id-badge"], ["payments", "Payments", "fas fa-money-check-alt"]];
        $("tabs").innerHTML = Tabs.map(([Id, Label, Icon]) => `<div class="tab italic ${S.tab === Id ? "active" : ""}" data-tab="${Id}"><i class="${Icon}"></i> ${Label}</div>`).join("");
    };

    const RoleChips = (Current, Attr) => `<div class="chips">${S.view.Roles.map(R =>
        `<div class="chip ${R.Name === Current ? "accent" : ""}" ${Attr}="${Esc(R.Name)}">${Esc(R.Name)}</div>`).join("") || `<p class="note">No roles yet, create one in the Roles tab.</p>`}</div>`;

    const RenderEmployees = () => {
        const V = S.view;
        const List = V.Employees.map(E => `
            <div class="row ${S.employee === E.Cid && !S.hiring ? "selected" : ""}" data-employee="${Esc(E.Cid)}">
                <div class="dot ${E.Online ? "on" : ""}"></div>
                <p class="name">${Esc(E.Name)}</p>
                <span class="chip">${Esc(E.Role)}</span>
            </div>`).join("") || `<div class="empty"><i class="fas fa-user-slash"></i><p>No employees yet</p></div>`;

        let Detail;
        const E = V.Employees.find(X => X.Cid === S.employee);
        if (S.hiring) {
            Detail = `<h1 class="italic">Hire employee</h1><p class="subtitle">Pick the role, then enter their State ID.</p>
                <div class="section"><div class="section-title">Role</div>${RoleChips(null, "data-hire")}</div>
                <div class="section"><div class="btn ghost small" data-act="cancelHire">Cancel</div></div>`;
        } else if (E) {
            Detail = `<h1 class="italic">${Esc(E.Name)}</h1>
                <p class="subtitle">State ID <span class="mono">${Esc(E.Cid)}</span> · ${E.Online ? "In the city" : "Not in the city"}</p>
                <div class="section"><div class="section-title">Role</div>
                    ${Can("ChangeRole") ? RoleChips(E.Role, "data-setrole") : `<span class="chip accent">${Esc(E.Role)}</span>`}</div>
                <div class="section"><div class="section-title">Actions</div><div class="actions">
                    ${Can("PayEmployee") ? `<div class="btn" data-act="payEmployee"><i class="fas fa-money-bill-wave"></i> Pay</div>` : ""}
                    ${Can("Fire") ? (S.confirm === "fire:" + E.Cid
                        ? `<div class="btn danger" data-act="fireConfirm"><i class="fas fa-check"></i> Confirm fire</div><div class="btn ghost" data-act="cancel">Cancel</div>`
                        : `<div class="btn ghost" data-act="fire"><i class="fas fa-user-times"></i> Fire</div>`) : ""}
                    ${!Can("PayEmployee") && !Can("Fire") ? `<p class="note">No actions available for your role.</p>` : ""}
                </div></div>
                ${V.IsOwner ? `<div class="section"><div class="section-title">Business bank access</div>
                    ${S.bank && S.bank.Cid === E.Cid
                        ? `<div class="toggles">${V.BankPermissions.map(P => Toggle(PERM_LABELS[P] || P, S.bank.Perms[P], `data-bank="${P}"`, true)).join("")}</div>
                           <p class="note" style="margin-top:10px">Without "View balance" the employee has no access to the account.</p>`
                        : `<p class="note">Loading...</p>`}</div>` : ""}`;
        } else {
            Detail = `<div class="empty"><i class="fas fa-user"></i><p>Select an employee</p></div>`;
        }

        $("body").innerHTML = `
            <div class="list">
                <div class="list-head"><p>${V.Employees.length} ${V.Employees.length === 1 ? "employee" : "employees"}</p>${Can("Hire") ? `<div class="btn small" data-act="hire"><i class="fas fa-user-plus"></i> Hire</div>` : ""}</div>
                <div class="rows">${List}</div>
            </div>
            <div class="detail">${Detail}</div>`;
    };

    const RenderRoles = () => {
        const V = S.view;
        const Count = Name => V.Employees.filter(E => E.Role === Name).length;
        const People = N => `${N} ${N === 1 ? "employee" : "employees"}`;
        const List = V.Roles.map(R => `
            <div class="row ${S.role === R.Name ? "selected" : ""}" data-role="${Esc(R.Name)}">
                <p class="name">${Esc(R.Name)}</p><span class="meta">${People(Count(R.Name))}</span>
            </div>`).join("") || `<div class="empty"><i class="fas fa-id-badge"></i><p>No roles yet</p></div>`;

        const R = V.Roles.find(X => X.Name === S.role);
        let Detail = `<div class="empty"><i class="fas fa-id-badge"></i><p>Select a role</p></div>`;
        if (R) {
            Detail = `<h1 class="italic">${Esc(R.Name)}</h1><p class="subtitle">${People(Count(R.Name))} with this role${V.IsOwner ? "" : " · only the owner can edit roles"}</p>
                <div class="section"><div class="section-title">Permissions</div>
                    <div class="toggles">${V.Permissions.map(P => Toggle(PERM_LABELS[P] || P, R.Perms[P], `data-perm="${P}"`, V.IsOwner)).join("")}</div></div>
                ${V.IsOwner ? `<div class="section"><div class="actions">${S.confirm === "role:" + R.Name
                    ? `<div class="btn danger" data-act="deleteRoleConfirm"><i class="fas fa-check"></i> Confirm delete</div><div class="btn ghost" data-act="cancel">Cancel</div>`
                    : `<div class="btn ghost" data-act="deleteRole"><i class="fas fa-trash"></i> Delete role</div>`}</div></div>` : ""}`;
        }

        $("body").innerHTML = `
            <div class="list">
                <div class="list-head"><p>${V.Roles.length} ${V.Roles.length === 1 ? "role" : "roles"}</p>${V.IsOwner ? `<div class="btn small" data-act="createRole"><i class="fas fa-plus"></i> New role</div>` : ""}</div>
                <div class="rows">${List}</div>
            </div>
            <div class="detail">${Detail}</div>`;
    };

    const RenderPayments = () => {
        const V = S.view;
        $("body").innerHTML = `<div class="detail">
            <p class="section-title">Business account</p>
            <p class="balance italic">${V.Balance !== null && V.Balance !== undefined ? Money(V.Balance) : "No account"}</p>
            ${V.Account ? `<p class="note mono">Account ${Esc(V.Account)}</p>` : ""}
            <div class="section cards">
                <div class="card"><i class="fas fa-hand-holding-usd"></i><h3 class="italic">Pay someone</h3>
                    <p>Send money from the business account to any citizen.</p>
                    ${Can("PayExternal") ? `<div class="btn" data-act="payExternal">Pay</div>` : `<p class="note">Your role can't do this.</p>`}</div>
                <div class="card"><i class="fas fa-file-invoice-dollar"></i><h3 class="italic">Charge a customer</h3>
                    <p>Send an invoice to a citizen's phone. Tax is added on top.</p>
                    ${Can("ChargeExternal") ? `<div class="btn" data-act="charge">Charge</div>` : `<p class="note">Your role can't do this.</p>`}</div>
            </div></div>`;
    };

    const Render = () => {
        const V = S.view;
        if (!V) return;
        $("brand").textContent = V.Business;
        $("owner").textContent = V.Owner;
        $("myRole").textContent = V.MyRole || "-";
        $("balance").textContent = V.Balance !== null && V.Balance !== undefined ? Money(V.Balance) : "";
        RenderTabs();
        ({ employees: RenderEmployees, roles: RenderRoles, payments: RenderPayments })[S.tab]();
    };

    const Lock = Text => {
        S.view = null;
        $("lockText").textContent = Text || "Use the laptop to manage the business";
        $("lock").classList.remove("hidden");
    };

    // ── Form (typed on the screen, fw-dui keys.js) ──────────────────────────

    const FIELDS = {
        Cid: { label: "State ID", type: "text" },
        Amount: { label: "Amount ($)", type: "number" },
        Comment: { label: "Comment", type: "text" },
        Name: { label: "Role name", type: "text" },
    };
    let FormAction = null;
    const Form = (Title, Fields, Action, Extra = {}) => {
        FormAction = { Action, Extra, Fields };
        $("form").innerHTML = `<h3 class="italic">${Esc(Title)}</h3>${Fields.map(F => `<div><label>${FIELDS[F].label}</label>
            <input name="${F}" type="${FIELDS[F].type}" maxlength="${F === "Comment" ? 60 : 24}" autocomplete="off" spellcheck="false"></div>`).join("")}
            <div class="row"><div class="btn" data-act="formCancel">Cancel</div><button type="submit" class="btn">Confirm</button></div>`;
        $("modal").classList.remove("hidden");
        $("form").querySelector("input").focus();
        Post("sound");
    };
    const CloseForm = () => { FormAction = null; $("modal").classList.add("hidden"); };
    $("form").addEventListener("submit", Ev => {
        Ev.preventDefault();
        if (!FormAction) return;
        const Data = { ...FormAction.Extra };
        for (const F of FormAction.Fields) Data[F] = $("form").elements[F].value.trim();
        if (FormAction.Fields.some(F => F !== "Comment" && !Data[F])) return Toast("Fill in every field", "error");
        Post(FormAction.Action, Data);
        CloseForm();
    });

    // ── Input ───────────────────────────────────────────────────────────────

    const OpenBank = Cid => { S.bank = null; Post("getBank", { Cid }); };

    document.addEventListener("click", Ev => {
        const T = Ev.target;
        const Get = A => T.closest(`[${A}]`);
        let El;

        if ((El = Get("data-tab"))) { S.tab = El.dataset.tab; S.confirm = null; S.hiring = false; Post("sound"); return Render(); }
        if ((El = Get("data-employee"))) {
            S.employee = El.dataset.employee; S.hiring = false; S.confirm = null; Post("sound");
            if (S.view.IsOwner) OpenBank(S.employee);
            return Render();
        }
        if ((El = Get("data-role"))) { S.role = El.dataset.role; S.confirm = null; Post("sound"); return Render(); }
        if ((El = Get("data-hire"))) { S.hiring = false; Render(); return Form("Hire employee", ["Cid"], "hire", { Role: El.dataset.hire }); }
        if ((El = Get("data-setrole"))) return Post("setRole", { Cid: S.employee, Role: El.dataset.setrole });
        if ((El = Get("data-perm"))) {
            const R = S.view.Roles.find(X => X.Name === S.role);
            return Post("setPermission", { Role: S.role, Permission: El.dataset.perm, Value: !R.Perms[El.dataset.perm] });
        }
        if ((El = Get("data-bank"))) return Post("setBank", { Cid: S.employee, Permission: El.dataset.bank, Value: !S.bank.Perms[El.dataset.bank] });

        if ((El = Get("data-act"))) {
            const A = El.dataset.act;
            if (A === "hire") { S.hiring = true; S.employee = null; Post("sound"); return Render(); }
            if (A === "formCancel") return CloseForm();
            if (A === "cancelHire" || A === "cancel") { S.hiring = false; S.confirm = null; return Render(); }
            if (A === "fire") { S.confirm = "fire:" + S.employee; return Render(); }
            if (A === "fireConfirm") { S.confirm = null; return Post("fire", { Cid: S.employee }); }
            if (A === "deleteRole") { S.confirm = "role:" + S.role; return Render(); }
            if (A === "deleteRoleConfirm") { S.confirm = null; return Post("deleteRole", { Role: S.role }); }
            if (A === "payEmployee") return Form("Pay employee", ["Amount", "Comment"], "pay", { Cid: S.employee });
            if (A === "payExternal") return Form("Pay someone", ["Cid", "Amount", "Comment"], "pay");
            if (A === "charge") return Form("Charge customer", ["Cid", "Amount", "Comment"], "charge");
            if (A === "createRole") return Form("New role", ["Name"], "createRole");
            Post(A); // refresh
        }
    });

    // ── Client -> page ──────────────────────────────────────────────────────

    window.addEventListener("message", Ev => {
        let M = Ev.data;
        if (typeof M === "string") { try { M = JSON.parse(M); } catch { return; } }
        if (!M || !M.action) return;
        const D = M.data;

        switch (M.action) {
            case "view":
                S.view = D;
                if (S.employee && !D.Employees.find(E => E.Cid === S.employee)) S.employee = null;
                if (S.role && !D.Roles.find(R => R.Name === S.role)) S.role = null;
                $("lock").classList.add("hidden");
                Render();
                break;
            case "bank": S.bank = D; Render(); break;
            case "toast": Toast(D.text, D.type); break;
            case "lock": CloseForm(); Lock(D && D.text); break;
        }
    });

    Lock();
