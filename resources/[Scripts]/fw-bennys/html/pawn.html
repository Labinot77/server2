<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pawn Order</title>
<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.4/css/all.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<style>
    :root {
        --accent: #f5b335; --bg: #121315; --panel: #1a1b1e; --panel-2: #222327; --line: rgba(255, 255, 255, 0.07);
        --muted: #8b8f96; --ok: #4ade80; --bad: #ef4444; --blue: #60a5fa; --purple: #a78bfa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: #eee; font-family: "Poppins", sans-serif; font-size: 13px; user-select: none; cursor: none; }
    .cond { font-family: "Barlow Semi Condensed", sans-serif; text-transform: uppercase; font-weight: 700; letter-spacing: .4px; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #3a3c41; border-radius: 3px; }

    .head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: linear-gradient(90deg, #1d1a14, #141517); }
    .logo { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #26231c; color: var(--accent); }
    .head h2 { font-size: 15px; font-weight: 600; } .head p { font-size: 12px; color: var(--muted); }
    .chip { margin-left: auto; padding: 7px 14px; border-radius: 18px; background: var(--panel-2); font-size: 12px; }
    .tabs { display: flex; gap: 4px; padding: 0 16px; background: #17181b; border-bottom: 1px solid var(--line); }
    .tab { padding: 12px 14px; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab i { margin-right: 6px; } .tab:hover { color: #fff; } .tab.active { color: var(--accent); border-color: var(--accent); }

    main { position: absolute; top: 106px; bottom: 34px; left: 0; right: 0; padding: 16px 18px 0; display: flex; flex-direction: column; }
    .bar { display: flex; align-items: center; gap: 6px; margin: 10px 0 12px; }
    h1 { font-size: 22px; font-weight: 600; }
    .filter { padding: 6px 10px; border-radius: 4px; background: var(--panel-2); font-size: 11px; }
    .filter b { margin-left: 5px; padding: 0 5px; border-radius: 8px; background: rgba(255,255,255,.1); font-size: 10px; }
    .filter.active { background: var(--accent); color: #111; } .filter.active b { background: rgba(0,0,0,.2); }
    .search { margin-left: auto; width: 180px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: #17181b; color: #fff; font: inherit; font-size: 12px; outline: none; }
    .btn { padding: 7px 14px; border-radius: 5px; background: var(--panel-2); color: #fff; font-size: 12px; font-weight: 600; text-align: center; }
    .btn:hover { filter: brightness(1.2); } .btn.gold { background: var(--accent); color: #111; } .btn.red { background: #9b2c2c; } .btn.off { opacity: .4; pointer-events: none; }

    .layout { flex: 1; display: flex; gap: 14px; min-height: 0; }
    .board { flex: 1; overflow-y: auto; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #16171a; }
    .section { margin-bottom: 14px; } .section > h3 { font-size: 12px; font-weight: 600; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .empty { padding: 30px; text-align: center; color: var(--muted); }

    .card { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 6px; background: var(--panel); border-left: 3px solid #3a3c41; }
    .card.ready { border-color: var(--ok); }
    .row { display: flex; align-items: center; gap: 6px; } .row .grow { flex: 1; }
    .card h4 { font-size: 13px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 11px; }
    .badge { padding: 2px 6px; border-radius: 3px; font-size: 10px; border: 1px solid currentColor; }
    .b-ready { color: var(--ok); } .b-missing { color: var(--muted); } .b-local { color: var(--blue); } .b-interstate { color: var(--purple); }
    .b-international { color: var(--accent); } .b-criminal { color: var(--bad); } .b-tag { color: #f87171; } .b-transit { color: var(--blue); }
    .items { padding: 6px; border-radius: 5px; background: #111214; }
    .item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin-bottom: 3px; border-radius: 3px; background: var(--panel-2); font-size: 11px; }
    .item:last-child { margin-bottom: 0; } .item img { width: 18px; height: 18px; object-fit: contain; } .item .name { flex: 1; }
    .have { width: 64px; text-align: right; } .have.ok { color: var(--ok); } .have.no { color: var(--bad); } .price { width: 58px; text-align: right; color: var(--ok); font-weight: 600; }
    .payout { font-size: 13px; } .payout b { color: var(--ok); font-size: 15px; } .fee { color: var(--accent); font-size: 10px; }

    .safe { width: 210px; display: flex; flex-direction: column; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: #16171a; }
    .safe h3 { font-size: 18px; } .safe .list { flex: 1; overflow-y: auto; margin-top: 10px; }
    .safe .entry { display: flex; align-items: center; gap: 8px; padding: 10px; margin-bottom: 6px; border-radius: 4px; background: var(--panel); font-size: 11px; }
    .safe .entry.wanted { box-shadow: inset 2px 0 var(--accent); } .safe .entry img { width: 24px; height: 24px; object-fit: contain; } .safe .entry span { flex: 1; } .safe .entry b { color: var(--muted); }

    .ship { padding: 12px 14px; margin-bottom: 10px; border-radius: 6px; background: var(--panel); }
    .ship .row { margin-bottom: 8px; }
    .progress { height: 6px; margin: 4px 0 10px; border-radius: 3px; background: #0e0f11; overflow: hidden; } .progress div { height: 100%; background: var(--ok); }
    .drop { padding: 8px 12px; margin-bottom: 10px; border: 1px solid #5a4318; border-radius: 4px; background: #241d12; color: #d6b36a; font-size: 12px; } .drop b { color: var(--accent); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat { padding: 18px; border-radius: 6px; background: var(--panel); } .stat p { color: var(--muted); font-size: 11px; } .stat h3 { font-size: 26px; margin-top: 4px; }
    .stat.green h3 { color: var(--ok); } .stat.gold h3 { color: var(--accent); }

    footer { position: absolute; bottom: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 16px; background: #0f1012; font-size: 10px; color: #ccc; }
    footer kbd { padding: 1px 5px; margin-right: 5px; border-radius: 2px; background: #eee; color: #111; font-family: inherit; font-weight: 700; }
    .lock { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); color: var(--muted); font-size: 15px; }
    .lock i { font-size: 34px; color: var(--accent); }
    .toast { position: absolute; right: 18px; bottom: 46px; z-index: 20; padding: 10px 16px; border-radius: 5px; background: #1f7a43; font-weight: 600; opacity: 0; transform: translateY(8px); transition: .2s; }
    .toast.show { opacity: 1; transform: none; } .toast.error { background: #9b2c2c; }
</style>
</head>
<body>
<div class="head">
    <div class="logo"><i class="fas fa-file-invoice"></i></div>
    <div><h2>Pawn Order</h2><p id="sub"></p></div>
    <div class="chip"><i class="fas fa-store"></i> <span id="biz"></span></div>
</div>
<div class="tabs" id="tabs"></div>
<main>
    <div class="row"><h1 id="title"></h1></div>
    <div class="bar"><div class="row" id="filters"></div><input class="search" id="search" placeholder="Search orders or items..."><div class="btn" data-act="refresh">Refresh</div></div>
    <div class="layout" id="body"></div>
</main>
<footer id="keys"></footer>
<div class="lock" id="lock"><i class="fas fa-lock"></i><p id="lockText"></p></div>
<div class="toast" id="toast"></div>

<script>
    const S = { view: null, tab: "buy", filter: "All", search: "", offset: 0, mock: location.search.includes("mock") };
    const $ = id => document.getElementById(id);
    const Esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const Money = v => "$" + Math.round(v || 0).toLocaleString("en-US");
    const Img = I => I ? `<img src="nui://fw-inventory/html/img/items/${Esc(I)}" onerror="this.style.visibility='hidden'">` : "";
    const Now = () => Date.now() / 1000 + S.offset;
    const Left = T => { const S2 = Math.max(0, T - Now()), H = Math.floor(S2 / 3600), M = Math.floor(S2 % 3600 / 60); return H ? `${H}h ${M}m` : `${M}m`; };
    const Post = (Action, Data = {}) => { if (!S.mock) fetch("https://fw-bennys/pawn", { method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: JSON.stringify({ Action, ...Data }) }); };

    const TABS = {
        buy: ["Buy Orders", "fa-file-invoice", "Review and accept shop offers", [["Navigate", "fa-arrows-alt"], ["Accept", "↵"], ["Back", "ESC"]]],
        active: ["Active Orders", "fa-clipboard-check", "Fulfill accepted orders from the safe", [["Navigate", "fa-arrows-alt"], ["Fulfill", "↵"], ["Cancel Order", "F"], ["Back", "ESC"]]],
        ship: ["Shipments", "fa-truck", "Track packing and deliveries", [["Navigate", "fa-arrows-alt"], ["Actions", "↵"], ["Cancel Shipment", "F"], ["Close", "ESC"]]],
        stats: ["Stats", "fa-chart-line", "Business performance (30 days)", [["Back", "ESC"]]],
    };

    let ToastTimer;
    const Toast = (Text, Type) => { const El = $("toast"); El.textContent = Text; El.className = `toast show ${Type === "error" ? "error" : ""}`; clearTimeout(ToastTimer); ToastTimer = setTimeout(() => (El.className = "toast"), 2600); };
    const Lock = Text => { $("lockText").textContent = Text || "Use the computer to manage pawn orders"; $("lock").classList.remove("hidden"); };

    const Match = O => (S.filter === "All" || O.Category === S.filter) && (!S.search || [O.Label, ...O.Items.map(I => I.Label)].join(" ").toLowerCase().includes(S.search));
    const Badges = O => `<span class="badge cond b-${O.Route.toLowerCase()}">${Esc(O.Route)}</span>${O.Criminal ? '<span class="badge cond b-criminal">Criminal</span>' : ""}`;
    const Have = Item => (S.view.Safe.Items.find(I => I.Item === Item) || { Amount: 0 }).Amount;
    const Lines = O => `<div class="items">${O.Items.map(L => { const H = Have(L.Item), Ok = H >= L.Need;
        return `<div class="item">${Img(L.Image)}<span class="name">${Esc(L.Label)}</span><span class="have ${Ok ? "ok" : "no"}">${Ok ? "✓" : "✗"} ${H} / ${L.Need}</span><span class="price">${Money(L.Price)} ea</span></div>`; }).join("")}</div>`;

    const OrderCard = (O, Buttons, Expires) => `<div class="card ${O.Ready ? "ready" : ""}">
        <div class="row"><h4 class="grow">${Esc(O.Label)}</h4><span class="badge cond ${O.Ready ? "b-ready" : "b-missing"}">${O.Ready ? "Ready" : "Missing"}</span></div>
        <div class="row"><span class="meta grow">${Expires ? "Expires in " + Left(O.Expires) : "Accepted by " + Esc(O.AcceptedBy || "-")}</span>${Badges(O)}</div>
        ${Lines(O)}
        <div class="row"><div class="grow"><p class="payout">Payout: <b>${Money(O.Payout)}</b></p><p class="fee">Accept Fee: ${Money(O.Fee)}</p></div>${Buttons}</div></div>`;

    const Safe = () => { const { Items, Total, Wanted } = S.view.Safe;
        return `<div class="safe"><h3 class="cond">Safe</h3><p class="meta">${Wanted} wanted · ${Total} total</p><div class="list">${Items.map(I =>
            `<div class="entry ${I.Wanted ? "wanted" : ""}">${Img(I.Image)}<span>${Esc(I.Label)}</span><b>×${I.Amount}</b></div>`).join("") || '<p class="meta">The safe is empty</p>'}</div></div>`; };

    const Buy = () => {
        const List = S.view.Offers.filter(Match), Card = O => OrderCard(O, `<div class="btn gold ${O.Ready ? "" : "off"}" data-act="accept" data-id="${O.Id}">Accept</div>`, true);
        const Group = (Title, L) => L.length ? `<div class="section"><h3>${Title}</h3><div class="grid">${L.map(Card).join("")}</div></div>` : "";
        const Html = Group("Local Offers", List.filter(O => O.Route === "Local")) + Group("Interstate & International Offers", List.filter(O => O.Route !== "Local"));
        return `<div class="board">${Html || '<p class="empty">No offers</p>'}</div>${Safe()}`;
    };

    const Active = () => {
        const Html = S.view.Active.filter(Match).map(O => OrderCard(O, `<div class="row"><div class="btn red" data-act="cancel" data-id="${O.Id}">Cancel</div><div class="btn gold ${O.Ready ? "" : "off"}" data-act="fulfill" data-id="${O.Id}">Fulfill</div></div>`)).join("");
        return `<div class="board"><div class="section"><h3>Active Orders</h3>${Html ? `<div class="grid">${Html}</div>` : '<p class="empty">No active orders, accept one from Buy Orders</p>'}</div></div>${Safe()}`;
    };

    const Ship = () => {
        const Html = S.view.Shipments.filter(Match).map(O => {
            const Transit = O.Status === "transit", Pct = Transit ? O.Delivered / O.Boxes * 100 : 100;
            const Due = Transit ? Math.max(0, O.Delivered === O.Boxes ? O.Payout - O.Paid : Math.floor(O.Payout * (O.Delivered - O.CashedOut) / O.Boxes)) : 0;
            const Buttons = Transit
                ? `<div class="btn" data-act="gps" data-id="${O.Id}">Set GPS</div><div class="btn ${Due ? "gold" : "off"}" data-act="cashout" data-id="${O.Id}">Cash Out (${Money(Due)})</div>`
                : `<div class="btn gold" data-act="deliver" data-id="${O.Id}">Begin Delivery</div>`;
            return `<div class="ship">
                <div class="row"><h4 class="grow">${Esc(O.Label)}</h4></div>
                <div class="row"><span class="meta grow">${Transit ? `${O.Delivered}/${O.Boxes} boxes delivered` : `${O.Boxes}/${O.Boxes} boxes packed`} · expires in ${Left(O.Expires)}</span>
                    <span class="badge cond b-tag">${Esc(O.Tag)}</span>${Badges(O)}<span class="badge cond ${Transit ? "b-transit" : "b-international"}">${Transit ? "In Transit" : "Ready"}</span></div>
                <div class="progress"><div style="width:${Pct}%"></div></div>
                ${Transit ? `<div class="drop">Drop-off: <b>${Esc(O.Dropoff.Label)}</b></div>` : '<p class="meta" style="margin-bottom:10px">Boxes are in the drop-off storage, load them up and begin the delivery.</p>'}
                <div class="row"><p class="payout grow">Payout: <b>${Money(O.Payout)}</b></p>${Buttons}<div class="btn red" data-act="cancel" data-id="${O.Id}">Cancel</div></div></div>`;
        }).join("");
        return `<div class="board"><h1 style="margin-bottom:12px">Active Shipments</h1>${Html || '<p class="empty">No shipments</p>'}</div>`;
    };

    const Stats = () => { const T = S.view.Stats;
        const Box = (L, V, C = "") => `<div class="stat ${C}"><p class="cond">${L}</p><h3>${V}</h3></div>`;
        return `<div class="board"><div class="stats">${Box("Revenue", Money(T.Revenue), "green")}${Box("Accept Fees", Money(T.Fees), "gold")}${Box("Profit", Money(T.Revenue - T.Fees), "green")}
            ${Box("Completed Orders", T.Completed)}${Box("Boxes Delivered", T.Boxes)}${Box("Open / Cancelled", `${T.Open} / ${T.Cancelled}`)}</div></div>`; };

    const Render = () => {
        if (!S.view) return;
        const [Title, , Sub, Keys] = TABS[S.tab];
        $("sub").textContent = Sub; $("title").textContent = S.tab === "ship" ? "" : Title; $("biz").textContent = S.view.Business.toLowerCase().replace(/\W+/g, "_");
        $("tabs").innerHTML = Object.entries(TABS).map(([K, [L, I]]) => `<div class="tab cond ${S.tab === K ? "active" : ""}" data-tab="${K}"><i class="fas ${I}"></i>${L}</div>`).join("");
        const Counts = S.view.Offers.reduce((C, O) => (C[O.Category] = (C[O.Category] || 0) + 1, C), { All: S.view.Offers.length });
        $("filters").innerHTML = S.tab === "buy" ? Object.entries(Counts).map(([K, N]) => `<div class="filter cond ${S.filter === K ? "active" : ""}" data-filter="${K}">${K}<b>${N}</b></div>`).join("") : "";
        $("search").classList.toggle("hidden", S.tab === "stats");
        $("keys").innerHTML = Keys.map(([L, K]) => `<span class="cond"><kbd>${K.startsWith("fa-") ? `<i class="fas ${K}"></i>` : K}</kbd>${L}</span>`).join("");
        $("body").innerHTML = { buy: Buy, active: Active, ship: Ship, stats: Stats }[S.tab]();
    };

    $("search").addEventListener("input", Ev => { S.search = Ev.target.value.trim().toLowerCase(); Render(); });
    document.addEventListener("click", Ev => {
        const El = Ev.target.closest("[data-tab],[data-filter],[data-act]");
        if (!El) return;
        if (El.dataset.tab) { S.tab = El.dataset.tab; Post("sound"); return Render(); }
        if (El.dataset.filter) { S.filter = El.dataset.filter; Post("sound"); return Render(); }
        Post(El.dataset.act, { Id: Number(El.dataset.id) });
    });

    window.addEventListener("message", Ev => {
        let M = Ev.data;
        if (typeof M === "string") { try { M = JSON.parse(M); } catch { return; } }
        if (!M || !M.action) return;
        if (M.action === "view") { S.view = M.data; S.offset = M.data.Time - Date.now() / 1000; $("lock").classList.add("hidden"); Render(); }
        else if (M.action === "toast") Toast(M.data.text, M.data.type);
        else if (M.action === "lock") Lock(M.data && M.data.text);
    });
    setInterval(Render, 30000); // countdowns

    Lock();

    // Browser preview: pawn.html?mock
    if (S.mock) {
        const T = Date.now() / 1000;
        const L = (Item, Label, Need, Price) => ({ Item, Label, Need, Price });
        window.postMessage({ action: "view", data: { Business: "The Brick House", Time: T, Stats: { Revenue: 18420, Fees: 2650, Completed: 9, Boxes: 31, Open: 3, Cancelled: 1 },
            Safe: { Total: 46, Wanted: 31, Items: [{ Item: "rolex", Label: "Crowex Watch", Amount: 2, Wanted: true }, { Item: "white-pearl", Label: "Pearl Necklace", Amount: 26, Wanted: true }, { Item: "heirloom", Label: "Silver Ring", Amount: 20, Wanted: true }] },
            Offers: [
                { Id: 1, Category: "Jewelry", Label: "Jewelry Order", Route: "International", Criminal: true, Ready: true, Payout: 3236, Fee: 485, Expires: T + 20940, Items: [L("heirloom", "Silver Ring", 2, 189), L("rolex", "Crowex Watch", 2, 507), L("white-pearl", "Pearl Necklace", 2, 288)] },
                { Id: 2, Category: "General", Label: "General Order", Route: "Local", Criminal: false, Ready: false, Payout: 820, Fee: 123, Expires: T + 9000, Items: [L("laptop", "Laptop", 2, 300), L("phone", "Phone", 2, 110)] }],
            Active: [{ Id: 7, Category: "Jewelry", Label: "Jewelry Order", Route: "Interstate", Criminal: true, Ready: true, Payout: 2081, Fee: 312, AcceptedBy: "John Doe", Items: [L("rolex", "Crowex Watch", 2, 559)] }],
            Shipments: [
                { Id: 5, Label: "Art & Collectibles Order", Tag: "Valuables", Route: "Interstate", Status: "transit", Boxes: 5, Delivered: 2, CashedOut: 0, Paid: 0, Payout: 1935, Expires: T + 7140, Dropoff: { Label: "Freight Dropoff 02", Coords: { x: 0, y: 0 } }, Items: [] },
                { Id: 6, Label: "Silver Ring Order", Tag: "Valuables", Route: "Local", Status: "packed", Boxes: 1, Delivered: 0, Payout: 648, Expires: T + 86160, Items: [] }],
        } }, "*");
    }
</script>
<script src="nui://fw-dui/html/keys.js"></script>
</body>
</html>
