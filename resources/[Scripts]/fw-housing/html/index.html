<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&display=swap');
:root { --dark: rgba(16,16,18,.82); --text: #fff; --ink: #141414; --muted: #8d8d94; --green: #4fe36b; --red: #ff3b4e; --warn: #ffb52e; --teal: #3ad6c7; --blue: #1e9bff; }
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { display: none; width: 100vw; height: 100vh; overflow: hidden; color: var(--text); font: italic 700 1.4vh 'Saira Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; }
.sh { text-shadow: 0 .1vh .4vh rgba(0,0,0,.8); }
#view { position: absolute; inset: 0; }
.hidden { display: none !important; }

/* // left info \\ */
#info { position: absolute; left: 1vh; top: 5vh; width: 24vh; display: flex; flex-direction: column; gap: .7vh; }
#address { font-size: 2.4vh; font-weight: 800; letter-spacing: .05vh; }
.limit { background: #f2f2f2; color: var(--ink); display: flex; justify-content: space-between; padding: .25vh .8vh; font-size: 1.45vh; }
.bar { height: .7vh; background: rgba(0,0,0,.55); margin-top: -.7vh; } .bar div { height: 100%; background: var(--teal); }
#mode { font-size: 1.15vh; letter-spacing: .35vh; }
#unsaved { font-size: 1.1vh; color: var(--warn); }
#object { display: flex; flex-direction: column; gap: .5vh; margin-top: .8vh; }
#oname { border-left: .35vh solid #fff; padding: .2vh .9vh; font-size: 1.55vh; background: linear-gradient(90deg, rgba(0,0,0,.55), transparent); }
.req-h { background: #f2f2f2; color: var(--ink); font-size: 1.1vh; padding: .1vh .8vh; }
.req { display: flex; justify-content: space-between; padding: 0 .8vh; font-size: 1.45vh; }
.req .bad { color: var(--red); }
#warn { background: linear-gradient(90deg, rgba(110,10,18,.75), rgba(40,0,5,.35)); padding: .7vh .8vh; display: flex; flex-direction: column; gap: .4vh; font-size: 1.15vh; text-transform: none; }
#warn b { color: var(--red); display: flex; align-items: center; gap: .6vh; font-weight: 700; }
#warn span { color: var(--warn); font-weight: 600; }

/* // right hints \\ */
#hints { position: absolute; right: 1.2vh; top: 4vh; display: flex; flex-direction: column; align-items: flex-end; gap: 1vh; }
.modes { display: flex; gap: 1.4vh; margin-bottom: .6vh; }
.modes div { display: flex; align-items: center; gap: .7vh; cursor: pointer; opacity: .45; font-size: 1.75vh; }
.modes div.on { opacity: 1; }
.hint { display: flex; align-items: center; gap: .7vh; font-size: 1.75vh; }
.hint .lbl { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
.hint small { font-size: 1.15vh; color: var(--muted); }
.hint.g .lbl { color: var(--green); } .hint.r .lbl { color: var(--red); }
.key { background: #f2f2f2; color: var(--ink); min-width: 2.9vh; height: 2.9vh; padding: 0 .6vh; border-radius: .3vh; display: inline-flex; align-items: center; justify-content: center; font-size: 1.35vh; font-style: normal; }
.plus { font-size: 1.1vh; color: #ddd; }
.ico-m { width: 2.4vh; height: 2.9vh; }
.sep { width: 9vh; height: .1vh; background: rgba(255,255,255,.25); margin: .3vh 0; }

/* // bottom catalog \\ */
#shop { position: absolute; left: 0; right: 0; bottom: 0; }
#group { position: absolute; left: 1.1vh; bottom: 22.4vh; font-size: 1.1vh; letter-spacing: .2vh; }
#cats { position: absolute; left: 1.1vh; bottom: 16.6vh; display: flex; gap: .9vh; }
.cat { width: 4.2vh; height: 4.2vh; background: rgba(12,12,14,.85); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5vh; font-style: normal; }
.cat svg { width: 2.4vh; height: 2.4vh; fill: #fff; }
.cat.on { background: #f2f2f2; color: var(--ink); } .cat.on svg { fill: var(--ink); }
.cat .n { border: .15vh solid currentColor; padding: 0 .4vh; font-size: 1.2vh; }
#searchbox { position: absolute; right: 1.1vh; bottom: 16.6vh; display: flex; align-items: center; gap: 1.2vh; }
.search { display: flex; align-items: center; gap: .8vh; background: rgba(12,12,14,.6); padding: 0 1vh; height: 4.2vh; }
.search svg { width: 1.8vh; height: 1.8vh; fill: #fff; }
#search { width: 22vh; background: none; border: 0; outline: none; color: #fff; font: inherit; font-size: 2.2vh; text-transform: uppercase; user-select: text; }
#search::placeholder { color: rgba(255,255,255,.4); }
#total { background: #f2f2f2; color: var(--ink); height: 4.2vh; padding: 0 1.3vh; display: flex; align-items: center; font-size: 1.9vh; }
#grid { position: absolute; left: 0; right: 0; bottom: 0; height: 15.6vh; padding: .6vh 1.1vh; background: linear-gradient(0deg, rgba(10,10,12,.9), rgba(10,10,12,.6));
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 7vh); grid-auto-columns: 9.2vh; gap: .6vh .5vh; overflow-x: auto; overflow-y: hidden; }
#grid::-webkit-scrollbar { height: .4vh; } #grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.35); }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: .25vh; cursor: pointer; border: .2vh solid transparent; padding: .2vh; background: rgba(255,255,255,.04); }
.tile:hover { background: rgba(255,255,255,.1); }
.tile.on { border-color: #fff; }
.thumb { width: 100%; height: 4.6vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.thumb img { max-width: 100%; max-height: 100%; }
.thumb i { font-size: 1.8vh; color: rgba(255,255,255,.35); }
.tile span { width: 100%; text-align: center; font-size: 1.2vh; font-weight: 600; font-style: normal; text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zoom { position: absolute; top: .2vh; right: .2vh; width: 1.7vh; height: 1.7vh; background: var(--blue); display: flex; align-items: center; justify-content: center; }
.zoom svg { width: 1.1vh; height: 1.1vh; fill: #fff; }
#preview { position: absolute; width: 18vh; height: 18vh; background: rgba(10,10,12,.92); border: .2vh solid #fff; display: none; align-items: center; justify-content: center; pointer-events: none; }
#preview img { max-width: 92%; max-height: 92%; }

/* // options menu (right click) \\ */
#options { position: absolute; width: 23vh; background: rgba(12,12,14,.94); display: none; flex-direction: column; }
#options .head { background: #f2f2f2; color: var(--ink); padding: .4vh .9vh; font-size: 1.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#options .opt { padding: .65vh .9vh; cursor: pointer; display: flex; justify-content: space-between; font-size: 1.35vh; }
#options .opt:hover { background: rgba(255,255,255,.12); }
#options .opt.r { color: var(--red); }
#options .sub { padding: .4vh .9vh 0; font-size: 1vh; color: var(--muted); letter-spacing: .2vh; }
.kv { display: flex; gap: .4vh; padding: .2vh .9vh; align-items: center; }
.kv label { width: 5.5vh; font-size: 1.15vh; }
.kv label.x { color: #ff6b6b; } .kv label.y { color: #6be37f; } .kv label.z { color: #5f9dff; }
.kv input { flex: 1; min-width: 0; background: rgba(255,255,255,.08); border: .1vh solid rgba(255,255,255,.1); color: #fff; padding: .35vh .6vh; font: inherit; font-size: 1.2vh; font-style: normal; outline: none; user-select: text; }
.kv input:focus { border-color: #fff; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: .4vh; padding: .3vh .9vh .6vh; }
.swatches div { height: 2.2vh; cursor: pointer; border: .2vh solid transparent; }
.swatches div:hover { border-color: rgba(255,255,255,.6); } .swatches div.on { border-color: #fff; }
.hole { border-top: .1vh solid rgba(255,255,255,.08); padding-bottom: .3vh; }

/* // close modal \\ */
#modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); }
#modal .box { width: 32vh; background: rgba(12,12,14,.95); }
#modal .head { background: #f2f2f2; color: var(--ink); padding: .5vh 1vh; font-size: 1.6vh; }
#modal p { padding: 1.2vh 1vh; font-size: 1.3vh; color: #ccc; text-transform: none; font-weight: 600; }
#modal .row { display: flex; gap: .6vh; padding: 0 1vh 1vh; justify-content: flex-end; }
.btn { padding: .5vh 1.2vh; background: rgba(255,255,255,.1); cursor: pointer; font-size: 1.3vh; }
.btn:hover { background: rgba(255,255,255,.2); } .btn.w { background: #f2f2f2; color: var(--ink); } .btn.r:hover { background: var(--red); }
</style>
</head>
<body>
<div id="view"></div>

<div id="info" class="sh">
    <div id="address"></div>
    <div class="limit"><span>Object Limits</span><span id="limit">000/000</span></div>
    <div class="bar"><div id="limitbar"></div></div>
    <div id="mode">Build Mode</div>
    <div id="unsaved" class="hidden">Unsaved changes · Ctrl+S save</div>
    <div id="object" class="hidden">
        <div id="oname"></div>
        <div id="reqs"></div>
        <div id="warn" class="hidden"><b>⚠ Error/Warning</b><span id="warntext"></span></div>
    </div>
</div>

<div id="hints" class="sh"></div>

<div id="shop" class="sh">
    <div id="group">Any</div>
    <div id="cats"></div>
    <div id="searchbox">
        <div class="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg><input id="search" placeholder="Search"></div>
        <div id="total">Total: 0/0</div>
    </div>
    <div id="grid"></div>
</div>
<div id="preview"></div>

<div id="options"></div>

<div id="modal"><div class="box">
    <div class="head">Unsaved Changes</div>
    <p>Save your changes before you close the editor?</p>
    <div class="row"><div class="btn" onclick="hide('modal')">Cancel</div><div class="btn r" onclick="post('close',{Save:false})">Discard</div><div class="btn w" onclick="post('close',{Save:true})">Save</div></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const hide = id => $(id).style.display = 'none';
const post = (name, data = {}) => fetch(`https://${GetParentResourceName()}/editor/${name}`, { method: 'POST', body: JSON.stringify(data) }).then(r => r.json()).catch(() => ({}));
const esc = t => String(t).replace(/[<>&"]/g, c => `&#${c.charCodeAt(0)};`);
const title = t => String(t).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const label = m => title(m.replace(/^[a-z]+_mp_h_/, '').replace(/^[a-z]+_prop_/, '').replace(/^prop_/, '').replace(/^v_[a-z]+_/, ''));
const money = n => '$' + Math.floor(n).toLocaleString('en-US');

let catalog = [], groups = [], entities = [], colors = [], thumb = '', s = { List: [] }, group = -1, picked = null, shown = [], drawn = 0;
let lmb = false, rmb = false, rmbMoved = false, look = [0, 0], busy = false, clip = null, warnTimer = 0;

// // Icons \\
const P = {
    grid: 'M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z',
    clipboard: 'M9 2h6v2h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zm0 7v2h6V9zm0 4v2h6v-2z',
    tools: 'M21.7 18.6l-8.6-8.6c.9-2.2.4-4.8-1.4-6.6C9.8 1.5 7 1.1 4.8 2.1l4 4-2.8 2.8-4-4C.9 7.1 1.4 9.9 3.3 11.8c1.8 1.8 4.4 2.3 6.6 1.4l8.6 8.6c.4.4 1 .4 1.4 0l1.8-1.8c.4-.4.4-1 0-1.4z',
    tree: 'M12 2l7 9h-4l5 7h-7v4h-2v-4H4l5-7H5z',
    house: 'M12 3l10 9h-3v9h-5v-6h-4v6H5v-9H2z',
    bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
    faucet: 'M4 10h9V8H9V6h8v2h-2v2h2a4 4 0 0 1 4 4v1h-3v-1a1 1 0 0 0-1-1H4zm14 7c0 1.5 1.5 3 1.5 3a1.5 1.5 0 0 1-3 0s1.5-1.5 1.5-3z',
    plug: 'M8 2h2v5h4V2h2v5h2v5a6 6 0 0 1-5 5.9V22h-2v-4.1A6 6 0 0 1 6 12V7h2z',
    briefcase: 'M9 3h6a2 2 0 0 1 2 2v2h4v13H3V7h4V5a2 2 0 0 1 2-2zm0 2v2h6V5z',
    kit: 'M9 3h6v3h5a1 1 0 0 1 1 1v13H3V7a1 1 0 0 1 1-1h5zm2 2v1h2V5zm0 5v3H8v2h3v3h2v-3h3v-2h-3v-3z',
    zoom: 'M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z',
};
const svg = n => `<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
// Mouse with the used button filled: l, r, m (scroll), a (any / look).
const mouse = b => `<svg class="ico-m" viewBox="0 0 20 26" fill="none" stroke="#fff" stroke-width="1.8"><rect x="2" y="1.5" width="16" height="23" rx="8"/><path d="M10 1.5v9M2 10.5h16"/>`
    + (b === 'l' ? '<path d="M3 10.5V9a7 7 0 0 1 7-7v8.5z" fill="#fff"/>' : b === 'r' ? '<path d="M17 10.5V9a7 7 0 0 0-7-7v8.5z" fill="#fff"/>' : b === 'm' ? '<rect x="8.3" y="4" width="3.4" height="5" rx="1.7" fill="#fff"/>' : '') + '</svg>';
const selIcon = '<svg class="ico-m" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="6.5" r="2"/><circle cx="12" cy="17.5" r="2"/><circle cx="6.5" cy="12" r="2"/><circle cx="17.5" cy="12" r="2"/></svg>';
const key = k => `<span class="key">${k}</span>`;

// // Catalog \\
function items() {
    if (group === -2) return s.List.map(i => ({ M: i.Model, L: i.Label, Key: i.Key, D: i.Dist }));
    const g = groups[group];
    if (g && g.Entities) return entities;
    return g ? catalog.filter(i => g.Categories.includes(i.C)) : catalog;
}

function tile(i) {
    const name = i.L || label(i.M);
    const on = picked === (i.Key || i.M) ? 'on' : '';
    const img = i.W || !thumb ? `<i>▦</i>` : `<img src="${thumb.replace('%s', i.M)}" loading="lazy" onerror="this.outerHTML='<i>▦</i>'">`;
    return `<div class="tile ${on}" data-m="${esc(i.M)}" data-k="${i.Key || ''}" data-w="${i.W ? 1 : ''}">${i.W || !thumb ? '' : `<div class="zoom">${svg('zoom')}</div>`}<div class="thumb">${img}</div><span>${esc(i.D !== undefined ? `${name} · ${i.D.toFixed(1)}m` : name)}</span></div>`;
}

const PAGE = 300;
function drawGrid() {
    const q = $('search').value.trim().toLowerCase().replace(/\s+/g, '_');
    const all = items().map(i => typeof i === 'string' ? { M: i } : i);
    shown = q ? all.filter(i => i.M.toLowerCase().includes(q) || (i.L || '').toLowerCase().replace(/\s+/g, '_').includes(q)) : all;
    $('total').textContent = `Total: ${shown.length}/${all.length}`;
    $('group').textContent = group === -2 ? 'Placed' : groups[group] ? groups[group].Name : 'Any';
    drawn = Math.min(PAGE, shown.length);
    $('grid').innerHTML = shown.slice(0, drawn).map(tile).join('');
    $('grid').scrollLeft = 0;
}
$('grid').addEventListener('scroll', e => {
    const g = e.target;
    if (drawn < shown.length && g.scrollLeft + g.clientWidth > g.scrollWidth - 200) {
        g.insertAdjacentHTML('beforeend', shown.slice(drawn, drawn + PAGE).map(tile).join(''));
        drawn += PAGE;
    }
});
$('grid').addEventListener('wheel', e => { e.preventDefault(); $('grid').scrollLeft += e.deltaY; }, { passive: false });
$('grid').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (!t) return;
    document.querySelectorAll('.tile.on').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    if (t.dataset.k) { picked = t.dataset.k; return post('select', { Key: t.dataset.k }); }
    picked = t.dataset.m;
    post('spawn', t.dataset.w ? { Wall: true } : { Model: t.dataset.m });
});
$('grid').addEventListener('mouseover', e => {
    const z = e.target.closest('.zoom'), p = $('preview');
    if (!z) return p.style.display = 'none';
    const r = z.getBoundingClientRect(), m = z.closest('.tile').dataset.m;
    p.innerHTML = `<img src="${thumb.replace('%s', m)}">`;
    p.style.left = Math.min(r.left, innerWidth - p.offsetWidth - 10) + 'px';
    p.style.top = (r.top - innerHeight * .19) + 'px';
    p.style.display = 'flex';
});
$('grid').addEventListener('mouseleave', () => hide('preview'));
$('search').addEventListener('input', drawGrid);

function drawCats() {
    $('cats').innerHTML = `<div class="cat ${group === -2 ? 'on' : ''}" data-g="-2"><span class="n">${s.Placed ?? 0}</span></div>`
        + groups.map((g, i) => `<div class="cat ${group === i ? 'on' : ''}" data-g="${i}" title="${esc(g.Name)}">${P[g.Icon] ? svg(g.Icon) : esc(g.Icon)}</div>`).join('');
}
$('cats').addEventListener('click', e => {
    const c = e.target.closest('.cat');
    if (!c) return;
    group = group === +c.dataset.g ? -1 : +c.dataset.g;
    drawCats(); drawGrid();
});

// // Info + hints \\
function warn(text) {
    clearTimeout(warnTimer);
    $('warntext').textContent = text;
    $('warn').classList.remove('hidden'); $('object').classList.remove('hidden');
    warnTimer = setTimeout(() => { warnTimer = 0; render(); }, 3500);
}

function hintRows() {
    const H = (icon, text, cls = '', sub = '') => `<div class="hint ${cls}">${icon}<div class="lbl"><span>${text}</span>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
    const sep = '<div class="sep"></div>', plus = '<span class="plus">+</span>';
    const tail = [sep, H(key('Esc'), 'Close'), H(key('Y'), 'Tint'), H(key('L'), 'Link Mode', s.Link ? 'g' : ''), H(key('M'), 'Shopping Mode', s.Shop ? '' : 'r')];
    if (s.Placing) return [H(mouse('a'), 'Look'), H(mouse('l'), 'Place', 'g'), H(mouse('r'), 'Options', 'g'), H(mouse('m'), `Rotate (${s.Rot}°)`), H(key('R'), `Change Rotation (${s.Axis})`), H(selIcon, 'Selection'), ...tail];
    if (!s.Sel) return [H(mouse('a'), 'Look'), H(mouse('l'), 'Selection'), H(key('Ctrl') + plus + key('Z'), 'Undo'), H(key('Ctrl') + plus + key('S'), 'Save'), ...tail];
    return [
        H(key('Ctrl') + plus + mouse('l'), 'Multi-Select', '', `${s.Multi}/${s.MaxSelect}`),
        H(mouse('m'), `Rotate (${s.Rot}°)`),
        H(key('R'), `Change Rotation (${s.Axis})`),
        H(key('Ctrl') + plus + mouse('m'), 'Rotation Inc'),
        H(key('Alt') + plus + mouse('m'), `Grid Inc (${s.GridStep}m)`),
        H(key('Del'), 'Delete', 'r'),
        H(mouse('r'), 'Options', 'g'),
        H(mouse('a'), 'Look'),
        H(selIcon, 'Selection'),
        H(key('G'), 'Grid Snap', s.Grid ? 'g' : ''),
        ...tail];
}

function render() {
    drawCats();
    $('address').textContent = s.Address || '';
    $('limit').textContent = `${String(s.Placed ?? 0).padStart(3, '0')}/${s.Max ?? 0}`;
    $('limitbar').style.width = Math.min(100, (s.Placed ?? 0) / (s.Max || 1) * 100) + '%';
    $('unsaved').classList.toggle('hidden', !s.Dirty);
    $('shop').classList.toggle('hidden', !s.Shop);

    const sel = s.Sel, poor = s.Placing && s.Need !== undefined && s.Have < s.Need;
    $('object').classList.toggle('hidden', !sel && !warnTimer);
    $('oname').classList.toggle('hidden', !sel); $('reqs').classList.toggle('hidden', !sel);
    if (sel) {
        $('oname').textContent = title(sel.Label) + (s.Multi > 1 ? ` (+${s.Multi - 1})` : '');
        $('reqs').innerHTML = s.Placing && s.Need !== undefined
            ? `<div class="req-h">Object Requirements</div><div class="req"><span>Bank</span><span class="${poor ? 'bad' : ''}">${money(Math.max(0, s.Have))}/${money(s.Need)}</span></div>`
            : '';
    }
    if (!warnTimer) {
        $('warn').classList.toggle('hidden', !poor);
        if (poor) $('warntext').textContent = 'Not Enough Money: You do not have enough to build this object.';
    }

    $('hints').innerHTML = `<div class="modes"><div class="${s.Adv ? '' : 'on'}" onclick="post('key',{K:'basic'})">${key(1)}Basic</div><div class="${s.Adv ? 'on' : ''}" onclick="post('key',{K:'advanced'})">${key(2)}Advanced</div></div>` + hintRows().join('');
    if (group === -2) drawGrid();
    if (!sel) hide('options');
}

// // Options menu \\
const PRESETS = { Door: { X: 0, Z: 0, W: 1, H: 2.25 }, Window: { X: 0, Z: 1, W: 1, H: 1 } };
const wallCopy = () => JSON.parse(JSON.stringify(s.Sel.Wall));
const opt = (text, fn, cls = '', right = '') => `<div class="opt ${cls}" onclick="${fn}">${text}<span>${right}</span></div>`;
const field = (lbl, attrs, val, cls = '') => `<div class="kv"><label class="${cls}">${lbl}</label><input type="number" ${attrs} value="${val}"></div>`;

function openOptions(x, y) {
    const sel = s.Sel, o = $('options');
    if (!sel) return;
    let html = `<div class="head">${esc(title(sel.Label))}</div>`
        + opt('Duplicate', "act('duplicate')") + opt('Place On Ground', "act('ground')") + opt('Reset Rotation', "act('reset')")
        + (sel.Wall ? '<div class="sub">Colour</div><div class="swatches">' + colors.slice(0, 16).map((c, i) =>
            `<div class="${sel.Tint === i ? 'on' : ''}" style="background:${c[1]}" title="${esc(c[0])}" onclick="post('tint',{Value:${i}}).then(()=>setTimeout(()=>openOptions(),50))"></div>`).join('') + '</div>'
            : opt('Tint', "post('key',{K:'tint'}).then(()=>setTimeout(()=>openOptions(),50))", '', `${sel.Tint + 1}/16`))
        + opt('Copy Position', 'clip={Pos:{...s.Sel.Pos},Rot:{...s.Sel.Rot}};hide(\'options\')') + (clip ? opt('Paste Position', "post('set',clip);hide('options')") : '');
    if (s.Adv) {
        html += '<div class="sub">Position</div>' + ['x', 'y', 'z'].map(a => field(a + ' pos', `data-t="Pos.${a}" step="0.01"`, (+sel.Pos[a]).toFixed(3), a)).join('')
            + '<div class="sub">Rotation</div>' + ['x', 'y', 'z'].map(a => field(a + ' rot', `data-t="Rot.${a}" step="1"`, (+sel.Rot[a]).toFixed(1), a)).join('');
    }
    if (sel.Wall) {
        html += '<div class="sub">Wall · steps of 0.25m</div>' + field('Length', 'data-w="L" step="0.25"', sel.Wall.L) + field('Height', 'data-w="H" step="0.25"', sel.Wall.H)
            + sel.Wall.Holes.map((h, i) => `<div class="hole">${opt(`Hole ${i + 1}`, `wallEdit(w=>w.Holes.splice(${i},1))`, 'r', '✕')}`
                + [['X', 'Offset'], ['Z', 'Bottom'], ['W', 'Width'], ['H', 'Height']].map(([k, l]) => field(l, `data-h="${i}" data-f="${k}" step="0.25"`, h[k])).join('') + '</div>').join('')
            + opt('+ Door Hole', "wallEdit(w=>w.Holes.push({...PRESETS.Door}))") + opt('+ Window Hole', "wallEdit(w=>w.Holes.push({...PRESETS.Window}))");
    }
    o.innerHTML = html + opt('Delete', "act('key',{K:'delete'})", 'r');
    if (x !== undefined) { o.dataset.x = x; o.dataset.y = y; }
    o.style.display = 'flex';
    o.style.left = Math.min(+o.dataset.x, innerWidth - o.offsetWidth - 8) + 'px';
    o.style.top = Math.min(+o.dataset.y, innerHeight - o.offsetHeight - 8) + 'px';
}
function act(name, data) { hide('options'); post(name, data); }
function wallEdit(fn) { const w = wallCopy(); fn(w); post('wall', w).then(() => setTimeout(() => openOptions(), 80)); }
$('options').addEventListener('change', e => {
    const i = e.target, v = parseFloat(i.value) || 0;
    if (i.dataset.t) {
        const t = { Pos: { ...s.Sel.Pos }, Rot: { ...s.Sel.Rot } }, [a, b] = i.dataset.t.split('.');
        t[a][b] = v; post('set', t);
    } else wallEdit(w => i.dataset.w ? w[i.dataset.w] = v : w.Holes[i.dataset.h][i.dataset.f] = v);
});

// // Mouse / keys \\
const view = $('view');
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('mousedown', e => {
    document.activeElement.blur(); hide('options');
    if (e.button === 0) { lmb = true; post('down', { Ctrl: e.ctrlKey }); }
    if (e.button === 2) { rmb = true; rmbMoved = false; }
});
addEventListener('mouseup', e => {
    if (e.button === 0 && lmb) { lmb = false; post('up'); }
    if (e.button === 2 && rmb) {
        rmb = false;
        if (!rmbMoved) post('options').then(r => setTimeout(() => r && r.Open && openOptions(e.clientX, e.clientY), 30));
    }
});
addEventListener('mousemove', e => {
    if (!rmb) return;
    if (Math.abs(e.movementX) + Math.abs(e.movementY) > 1) rmbMoved = true;
    look[0] += e.movementX; look[1] += e.movementY;
    if (!busy) { busy = true; const [dx, dy] = look; look = [0, 0]; post('look', { dx, dy }).finally(() => busy = false); }
});
view.addEventListener('wheel', e => post('wheel', { d: e.deltaY, Ctrl: e.ctrlKey, Alt: e.altKey }), { passive: true });
const typing = e => e.target.tagName === 'INPUT';
document.addEventListener('focusin', e => typing(e) && post('typing', { State: true }));
document.addEventListener('focusout', e => typing(e) && post('typing', { State: false }));

function askClose() { if (s.Dirty) $('modal').style.display = 'flex'; else post('close'); }

const KEYS = { 1: 'basic', 2: 'advanced', r: 'axis', g: 'grid', y: 'tint', l: 'link', m: 'shop', delete: 'delete' };
addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if ($('modal').style.display === 'flex') hide('modal');
        else if ($('options').style.display === 'flex') hide('options');
        else if (s.Placing || s.Sel) { picked = null; post('key', { K: 'cancel' }); document.querySelectorAll('.tile.on').forEach(x => x.classList.remove('on')); }
        else askClose();
        return;
    }
    if (document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (e.altKey) e.preventDefault();
    if (e.ctrlKey) {
        const c = { z: 'undo', y: 'redo', s: 'save' }[k];
        if (c) { e.preventDefault(); post('key', { K: c }); }
        return;
    }
    if (KEYS[k]) post('key', { K: KEYS[k] });
});

addEventListener('message', ({ data: m }) => {
    if (m.Action === 'Open') {
        catalog = m.Data.Catalog || []; groups = m.Data.Groups || []; colors = m.Data.Colors || []; thumb = m.Data.Thumb || '';
        if (m.Data.Entities) entities = m.Data.Entities;
        s = { List: [], Address: m.Data.Address }; group = -1; picked = null;
        $('search').value = ''; hide('modal'); hide('options');
        document.body.style.display = 'block'; drawCats(); drawGrid();
    } else if (m.Action === 'State') { s = { ...m.Data, Address: s.Address }; s.List = s.List || []; render(); }
    else if (m.Action === 'Warn') warn(m.Text);
    else if (m.Action === 'Close') { document.body.style.display = 'none'; lmb = rmb = false; }
});
</script>
</body>
