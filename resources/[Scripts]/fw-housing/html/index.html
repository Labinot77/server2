<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Sizes are measured from a 1079px tall reference (1vh = 10.79px). */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,500;1,600;1,700;1,800&family=Barlow+Semi+Condensed:wght@500;600&display=swap');
:root { --ink: #121214; --paper: #f1f1f1; --muted: #8e8f96; --green: #4fe36b; --red: #ff3b4e; --warn: #ffb52e; --teal: #2fdccb; --tile: rgba(14, 16, 18, .92); --panel: rgba(18, 20, 24, .85); }
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { display: none; width: 100vw; height: 100vh; overflow: hidden; color: #fff; font: italic 700 1.48vh 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; }
.sh { text-shadow: 0 .1vh .3vh rgba(0, 0, 0, .7); }
#view { position: absolute; inset: 0; }
.hidden { display: none !important; }

/* // left column \\ */
#info { position: absolute; left: 4.45vh; top: 4.45vh; width: 22.25vh; }
#address { font-size: 2.05vh; font-weight: 800; height: 2.75vh; line-height: 2.75vh; letter-spacing: .03vh; }
#limits { margin-top: .45vh; height: 3.25vh; background: var(--paper); color: var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 1.3vh; font-size: 1.48vh; letter-spacing: .12vh; }
#bar { height: 1.1vh; background: rgba(8, 8, 8, .95); } #bar div { height: 100%; background: var(--teal); }
#stats { display: flex; gap: 1.1vh; margin-top: .55vh; }
.stat { flex: 1; height: 2.2vh; background: rgba(40, 38, 40, .7); border-bottom: .2vh solid #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 .65vh 0 .9vh; font-size: 1.38vh; }
.stat svg { width: 1.3vh; height: 1.3vh; fill: #fff; }
#mode { margin-top: 1.3vh; font-size: 1.2vh; letter-spacing: .55vh; font-weight: 800; }
#unsaved { margin-top: .5vh; font-size: 1.1vh; color: var(--warn); letter-spacing: .05vh; }

#object { margin-top: 1.4vh; display: flex; flex-direction: column; gap: .55vh; }
#oname { border-left: .35vh solid #fff; padding: .2vh .9vh; font-size: 1.55vh; background: linear-gradient(90deg, rgba(0, 0, 0, .55), transparent); }
.head { background: var(--paper); color: var(--ink); font-size: 1.1vh; padding: .15vh .8vh; display: flex; justify-content: space-between; }
.row { display: flex; justify-content: space-between; align-items: center; padding: 0 .8vh; font-size: 1.38vh; }
.row .v { font-family: 'Barlow Semi Condensed', sans-serif; font-style: normal; font-weight: 600; font-size: 1.2vh; text-transform: none; }
.row .bad { color: var(--red); }
.btns { display: flex; gap: .55vh; padding: 0 .8vh; }
.axes { display: flex; flex-direction: column; gap: .35vh; padding: .2vh .8vh 0; }
.axis { display: flex; align-items: center; gap: .55vh; }
.axis b { width: 2.2vh; font-size: 1.2vh; } .axis b.x { color: #ff6b6b; } .axis b.y { color: #6be37f; } .axis b.z { color: #5f9dff; }
.axis input { flex: 1; min-width: 0; height: 2.2vh; background: rgba(40, 38, 40, .75); border: .1vh solid transparent; color: #fff; padding: 0 .6vh; font: 600 1.2vh 'Barlow Semi Condensed', sans-serif; outline: none; user-select: text; }
.axis input:focus { border-color: #fff; }
.mini { height: 2.2vh; padding: 0 .7vh; display: flex; align-items: center; background: rgba(40, 38, 40, .75); cursor: pointer; font-size: 1.05vh; }
.mini:hover { background: var(--paper); color: var(--ink); }
.head .acts { display: flex; gap: .8vh; } .head .acts span { cursor: pointer; } .head .acts span:hover { text-decoration: underline; }
.btn { flex: 1; text-align: center; padding: .35vh 0; background: rgba(40, 38, 40, .75); cursor: pointer; font-size: 1.2vh; }
.btn:hover { background: var(--paper); color: var(--ink); }
#warn { background: linear-gradient(90deg, rgba(110, 10, 18, .75), rgba(40, 0, 5, .35)); padding: .7vh .8vh; display: flex; flex-direction: column; gap: .4vh; font-size: 1.15vh; text-transform: none; }
#warn b { color: var(--red); font-weight: 700; }
#warn span { color: var(--warn); font-family: 'Barlow Semi Condensed', sans-serif; font-style: normal; font-weight: 600; word-break: break-word; }

/* // right hints \\ */
#hints { position: absolute; right: 5vh; top: 5.3vh; display: flex; flex-direction: column; align-items: flex-end; gap: 2.04vh; }
.modes { display: flex; gap: 3.05vh; }
.modes div { display: flex; align-items: center; gap: .95vh; cursor: pointer; color: rgba(255, 255, 255, .45); }
.modes div .key { background: rgba(241, 241, 241, .45); }
.modes div.on { color: #fff; } .modes div.on .key { background: var(--paper); }
.hint { display: flex; align-items: center; gap: 1.2vh; height: 1.85vh; }
.hint.g .lbl { color: var(--green); } .hint.r .lbl { color: var(--red); }
.ico { position: relative; display: flex; align-items: center; gap: .4vh; }
.ico small { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); font-size: .95vh; color: #d8d8d8; white-space: nowrap; }
.key { background: var(--paper); color: var(--ink); min-width: 1.85vh; height: 1.85vh; padding: 0 .45vh; border-radius: .15vh; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2vh; font-style: normal; font-weight: 700; }
.plus { font-size: 1.1vh; color: #ddd; }
.ico svg { width: 1.85vh; height: 2.05vh; }
.sep { width: 4.35vh; height: .1vh; background: rgba(255, 255, 255, .35); margin: -.37vh -1.1vh -.37vh 0; }

/* // bottom catalog \\ */
#shop { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; }
#group { position: absolute; left: 4.45vh; bottom: 26.6vh; font-size: 1.05vh; letter-spacing: .3vh; font-weight: 800; }
#cats { position: absolute; left: 4.45vh; bottom: 20.5vh; display: flex; gap: .55vh; }
.cat { width: 4.45vh; height: 4.45vh; background: var(--panel); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.6vh; font-style: normal; }
.cat svg { width: 2.2vh; height: 2.2vh; fill: #fff; }
.cat.on { background: var(--paper); color: var(--ink); } .cat.on svg { fill: var(--ink); }
.cat.gap { margin-right: .55vh; } .cat.gapl { margin-left: .55vh; }
.cat .n { border: .15vh solid currentColor; border-radius: .15vh; padding: 0 .35vh; font-size: 1.2vh; line-height: 1.55vh; font-weight: 700; }
#searchbox { position: absolute; right: 4vh; bottom: 20.5vh; display: flex; gap: 1.1vh; height: 4.45vh; }
.search { width: 27.15vh; display: flex; align-items: center; gap: 1.1vh; background: var(--panel); padding: 0 1.2vh; }
.search svg { width: 1.85vh; height: 1.85vh; fill: #fff; flex: none; }
#search { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #fff; font: inherit; font-size: 2.04vh; font-weight: 800; text-transform: uppercase; user-select: text; }
#search::placeholder { color: rgba(255, 255, 255, .35); }
#total { background: var(--paper); color: var(--ink); padding: 0 1.2vh; display: flex; align-items: center; font-size: 1.48vh; }
#grid { position: absolute; left: 4.45vh; right: 0; bottom: 3.25vh; height: 16.05vh; padding-right: 4.45vh;
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 7.1vh); grid-auto-columns: 9.9vh; gap: .75vh .7vh; align-content: start; overflow-x: auto; overflow-y: hidden; }
#grid::-webkit-scrollbar { height: .37vh; } #grid::-webkit-scrollbar-track { background: transparent; } #grid::-webkit-scrollbar-thumb { background: #aaacb2; }
.tile { position: relative; background: var(--tile); border: .2vh solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: .55vh .6vh .5vh; }
.tile:hover { border-color: rgba(255, 255, 255, .35); }
.tile.on { border-color: #fff; }
.thumb { width: 100%; height: 3.9vh; display: flex; align-items: center; justify-content: center; }
.thumb img { max-width: 80%; max-height: 100%; }
.thumb .panel { background-size: 2.6vh 2.6vh; box-shadow: 0 .1vh .3vh rgba(0, 0, 0, .5); }
.thumb i { font-size: 1.8vh; color: rgba(255, 255, 255, .3); font-style: normal; }
.tile span { width: 100%; text-align: center; font: 600 1.15vh 'Barlow Semi Condensed', sans-serif; text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bucket { position: absolute; top: .75vh; right: .65vh; width: 1.75vh; height: 1.75vh; background: rgba(26, 46, 51, .95); display: flex; align-items: center; justify-content: center; }
.bucket svg { width: 1.15vh; height: 1.15vh; fill: #5dd0dd; }

/* // right click options \\ */
#options { position: absolute; width: 23vh; background: rgba(12, 12, 14, .94); display: none; flex-direction: column; padding-bottom: .3vh; }
#options .head { font-size: 1.4vh; padding: .4vh .9vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#options .opt { padding: .6vh .9vh; cursor: pointer; display: flex; justify-content: space-between; font-size: 1.35vh; }
#options .opt:hover { background: rgba(255, 255, 255, .12); }
#options .opt.r { color: var(--red); }
#options .sub { padding: .5vh .9vh .2vh; font-size: 1vh; color: var(--muted); letter-spacing: .2vh; }
.swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: .4vh; padding: .3vh .9vh .5vh; }
.swatches div { height: 2.2vh; cursor: pointer; border: .2vh solid transparent; }
.swatches div:hover { border-color: rgba(255, 255, 255, .6); } .swatches div.on { border-color: #fff; }
.kv { display: flex; gap: .4vh; padding: .2vh .9vh; align-items: center; }
.kv label { width: 5.5vh; font-size: 1.15vh; }
.kv label.x { color: #ff6b6b; } .kv label.y { color: #6be37f; } .kv label.z { color: #5f9dff; }
.kv input { flex: 1; min-width: 0; background: rgba(255, 255, 255, .08); border: .1vh solid rgba(255, 255, 255, .1); color: #fff; padding: .35vh .6vh; font: 600 1.2vh 'Barlow Semi Condensed', sans-serif; outline: none; user-select: text; }
.kv input:focus { border-color: #fff; }
.hole { border-top: .1vh solid rgba(255, 255, 255, .08); padding-bottom: .3vh; }

/* // close modal \\ */
#modal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .4); }
#modal .box { width: 32vh; background: rgba(12, 12, 14, .95); }
#modal .head { font-size: 1.6vh; padding: .5vh 1vh; }
#modal p { padding: 1.2vh 1vh; font: 600 1.3vh 'Barlow Semi Condensed', sans-serif; color: #ccc; text-transform: none; }
#modal .btns { padding: 0 1vh 1vh; }
#modal .btn.w { background: var(--paper); color: var(--ink); } #modal .btn.r:hover { background: var(--red); color: #fff; }
</style>
</head>
<body>
<div id="view"></div>

<div id="info" class="sh">
    <div id="address"></div>
    <div id="limits"><span>Object Limits</span><span id="limit">000/000</span></div>
    <div id="bar"><div id="limitbar"></div></div>
    <div id="stats"></div>
    <div id="mode">Build Mode</div>
    <div id="unsaved" class="hidden">Unsaved changes · Ctrl+S save</div>
    <div id="object" class="hidden">
        <div id="oname"></div>
        <div id="transform"></div>
        <div id="reqs"></div>
        <div id="warn" class="hidden"><b>⚠ Error/Warning</b><span id="warntext"></span></div>
    </div>
</div>

<div id="hints" class="sh"></div>

<div id="shop" class="sh">
    <div id="group">Any</div>
    <div id="cats"></div>
    <div id="searchbox">
        <div class="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2.6a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 0 0 0-10.8z"/></svg><input id="search" placeholder="Search"></div>
        <div id="total">Total: 0/0</div>
    </div>
    <div id="grid"></div>
</div>

<div id="options"></div>
<textarea id="clipboard" style="position:absolute;left:-100vw"></textarea>

<div id="modal"><div class="box">
    <div class="head">Unsaved Changes</div>
    <p>Save your changes before you close the editor?</p>
    <div class="btns"><div class="btn" onclick="hide('modal')">Cancel</div><div class="btn r" onclick="post('close',{Save:false})">Discard</div><div class="btn w" onclick="post('close',{Save:true})">Save</div></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const hide = id => $(id).style.display = 'none';
const post = (name, data = {}) => fetch(`https://${GetParentResourceName()}/editor/${name}`, { method: 'POST', body: JSON.stringify(data) }).then(r => r.json()).catch(() => ({}));
const esc = t => String(t).replace(/[<>&"]/g, c => `&#${c.charCodeAt(0)};`);
const title = t => String(t).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const label = m => title(m.replace(/^[a-z]+_mp_h_/, '').replace(/^[a-z]+_prop_/, '').replace(/^prop_/, '').replace(/^v_[a-z]+_/, ''));
const money = n => '$' + Math.floor(n).toLocaleString('en-US');
const num = (v, d) => (+v).toFixed(d);

let catalog = [], groups = [], entities = [], colors = [], thumb = '', s = { List: [] }, group = -1, picked = null, shown = [], drawn = 0;
let lmb = false, rmb = false, rmbMoved = false, look = [0, 0], busy = false, clip = {}, warnTimer = 0;

// // Icons \\
const P = {
    grid: 'M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z',
    clipboard: 'M9 2h6v2h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zm0 7v2h6V9zm0 4v2h6v-2z',
    tools: 'M21.7 18.6l-8.6-8.6c.9-2.2.4-4.8-1.4-6.6C9.8 1.5 7 1.1 4.8 2.1l4 4-2.8 2.8-4-4C.9 7.1 1.4 9.9 3.3 11.8c1.8 1.8 4.4 2.3 6.6 1.4l8.6 8.6c.4.4 1 .4 1.4 0l1.8-1.8c.4-.4.4-1 0-1.4z',
    tree: 'M12 2l7 9h-4l5 7h-7v4h-2v-4H4l5-7H5z',
    house: 'M12 3l10 9h-3v9h-5v-6h-4v6H5v-9H2z',
    bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
    faucet: 'M4 10h9V8H9V6h8v2h-2v2h2a4 4 0 0 1 4 4v1h-3v-1a1 1 0 0 0-1-1H4zm14 7c0 1.5 1.5 3 1.5 3a1.5 1.5 0 0 1-3 0s1.5-1.5 1.5-3z',
    plug: 'M8 2h2v5h4V2h2v5h2v5a6 6 0 0 1-5 5.9V22h-2v-4.1A6 6 0 0 1 6 12V7h2z',
    briefcase: 'M9 3h6a2 2 0 0 1 2 2v2h4v13H3V7h4V5a2 2 0 0 1 2-2zm0 2v2h6V5z',
    kit: 'M9 3h6v3h5a1 1 0 0 1 1 1v13H3V7a1 1 0 0 1 1-1h5zm2 2v1h2V5zm0 5v3H8v2h3v3h2v-3h3v-2h-3v-3z',
    bucket: 'M10.6 2.3l9.1 9.1-7.8 7.8a2 2 0 0 1-2.8 0L2.8 13a2 2 0 0 1 0-2.8l5.5-5.5-2-2L7.7 1.3zm-.9 3.8L4.9 11h11.6zM20 14.5s2 2.4 2 3.8a2 2 0 0 1-4 0c0-1.4 2-3.8 2-3.8z',
    crate: 'M3 7l9-4 9 4v10l-9 4-9-4zm9-1.8L6.6 7.6 12 10l5.4-2.4zM5 9.3v6.4l6 2.7v-6.4z',
    hanger: 'M12 3a3 3 0 0 1 1 5.8V10l9 6.5V19H2v-2.5L11 10V8h2V6.9A1 1 0 1 0 11 6H9a3 3 0 0 1 3-3zm0 9.3L4.6 17h14.8z',
    brick: 'M2 5h9v4H2zm11 0h9v4h-9zM2 11h4v4H2zm6 0h8v4H8zm10 0h4v4h-4zM2 17h9v4H2zm11 0h9v4h-9z',
};
const svg = n => `<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
// Mouse with the used button filled: l, r, m (wheel), '' (look).
const mouse = b => `<svg viewBox="0 0 20 24" fill="none" stroke="#fff" stroke-width="1.7"><rect x="2.5" y="1" width="15" height="22" rx="7.5"/><path d="M10 1v8.5M2.5 9.5h15"/>`
    + (b === 'l' ? '<path d="M3.4 9.5V8.5a6.6 6.6 0 0 1 6.6-6.6v7.6z" fill="#fff"/>' : b === 'r' ? '<path d="M16.6 9.5V8.5A6.6 6.6 0 0 0 10 1.9v7.6z" fill="#fff"/>' : b === 'm' ? '<rect x="8.4" y="3.5" width="3.2" height="4.6" rx="1.6" fill="#fff"/>' : '') + '</svg>';
const selIcon = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 1a11 11 0 1 1 0 22 11 11 0 0 1 0-22zm0 3.2l-2.6 3h5.2zm0 15.6l2.6-3H9.4zM4.2 12l3 2.6V9.4zm15.6 0l-3-2.6v5.2z"/></svg>';
const key = k => `<span class="key">${k}</span>`;

// // Catalog \\
function items() {
    if (group === -2) return s.List.map(i => ({ M: i.Model, L: i.Label, Key: i.Key, D: i.Dist }));
    const g = groups[group];
    if (g && g.Entities) return entities;
    return g ? catalog.filter(i => g.Categories.includes(i.C)) : catalog;
}

function thumbHtml(i) {
    if (i.I) { // custom wall: texture swatch shaped like the panel
        const w = i.A >= 1 ? Math.min(7.6, 3.9 * i.A) : 3.9 * i.A, h = i.A >= 1 ? w / i.A : 3.9;
        return `<div class="panel" style="width:${w}vh;height:${h}vh;background-image:url(${i.I})"></div>`;
    }
    if (i.W || !thumb) return '<i>▦</i>';
    return `<img src="${thumb.replace('%s', i.M)}" loading="lazy" onerror="this.outerHTML='<i>▦</i>'">`;
}

function tile(i) {
    const name = i.L || label(i.M);
    const on = picked === (i.Key || i.M) ? 'on' : '';
    return `<div class="tile ${on}" data-m="${esc(i.M)}" data-k="${i.Key || ''}" data-w="${i.W ? 1 : ''}">${i.T ? `<div class="bucket">${svg('bucket')}</div>` : ''}`
        + `<div class="thumb">${thumbHtml(i)}</div><span>${esc(i.D !== undefined ? `${name} · ${i.D.toFixed(1)}m` : name)}</span></div>`;
}

const PAGE = 300;
function drawGrid() {
    const q = $('search').value.trim().toLowerCase().replace(/\s+/g, '_');
    const all = items().map(i => typeof i === 'string' ? { M: i } : i);
    shown = q ? all.filter(i => i.M.toLowerCase().includes(q) || (i.L || '').toLowerCase().replace(/\s+/g, '_').includes(q)) : all;
    $('total').textContent = `Total: ${shown.length}/${all.length}`;
    $('group').textContent = group === -2 ? 'Placed' : groups[group] ? groups[group].Name : 'Any';
    drawn = Math.min(PAGE, shown.length);
    $('grid').innerHTML = shown.slice(0, drawn).map(tile).join('');
    $('grid').scrollLeft = 0;
}
$('grid').addEventListener('scroll', e => {
    const g = e.target;
    if (drawn < shown.length && g.scrollLeft + g.clientWidth > g.scrollWidth - 200) {
        g.insertAdjacentHTML('beforeend', shown.slice(drawn, drawn + PAGE).map(tile).join(''));
        drawn += PAGE;
    }
});
$('grid').addEventListener('wheel', e => { e.preventDefault(); $('grid').scrollLeft += e.deltaY; }, { passive: false });
$('grid').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (!t) return;
    document.querySelectorAll('.tile.on').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    if (t.dataset.k) { picked = t.dataset.k; return post('select', { Key: t.dataset.k }); }
    picked = t.dataset.m;
    post('spawn', t.dataset.w ? { Wall: true } : { Model: t.dataset.m });
});
$('search').addEventListener('input', drawGrid);

// Layout of the screenshots: [placed] | groups | [E], with a wider gap around the outer two.
function drawCats() {
    const last = groups.length - 1;
    $('cats').innerHTML = `<div class="cat gap ${group === -2 ? 'on' : ''}" data-g="-2"><span class="n">${s.Placed ?? 0}</span></div>`
        + groups.map((g, i) => `<div class="cat ${i === last && g.Entities ? 'gapl' : ''} ${group === i ? 'on' : ''}" data-g="${i}" title="${esc(g.Name)}">${P[g.Icon] ? svg(g.Icon) : esc(g.Icon)}</div>`).join('');
}
$('cats').addEventListener('click', e => {
    const c = e.target.closest('.cat');
    if (!c) return;
    group = group === +c.dataset.g ? -1 : +c.dataset.g;
    drawCats(); drawGrid();
});

// // Info + hints \\
function warn(text) {
    clearTimeout(warnTimer);
    $('warntext').textContent = text;
    $('warn').classList.remove('hidden'); $('object').classList.remove('hidden');
    warnTimer = setTimeout(() => { warnTimer = 0; render(); }, 3500);
}

function hintRows() {
    const H = (icon, text, cls = '', sub = '') => `<div class="hint ${cls}"><div class="ico">${icon}${sub ? `<small>${sub}</small>` : ''}</div><span class="lbl">${text}</span></div>`;
    const plus = '<span class="plus">+</span>', sep = '<div class="sep"></div>';
    const tail = [sep, H(key('Esc'), 'Close'), H(key('Y'), 'Tint'), H(key('L'), 'Link Mode', s.Link ? 'g' : ''), H(key('M'), 'Shopping Mode', s.Shop ? '' : 'r')];
    if (s.Placing) return [H(mouse(''), 'Look'), H(mouse('l'), 'Place', 'g'), H(mouse('r'), 'Options', 'g'), H(selIcon, 'Selection'), ...tail];
    if (!s.Sel) return [H(mouse(''), 'Look', '', `${s.Multi || 0}/${s.MaxSelect || 10}`), H(selIcon, 'Selection'), ...tail];
    return [
        H(key('Ctrl') + plus + mouse('l'), 'Multi-Select', '', `${s.Multi}/${s.MaxSelect}`),
        H(mouse('m'), `Rotate (${s.Rot}°)`),
        H(key('R'), `Change Rotation (${s.Axis})`),
        H(key('Ctrl') + plus + mouse('m'), 'Rotation Inc'),
        H(key('Alt') + plus + mouse('m'), `Grid Inc (${s.GridStep}m)`),
        H(key('Del'), 'Delete', 'r'),
        H(mouse('r'), 'Options', 'g'),
        H(mouse(''), 'Look'),
        H(selIcon, 'Selection'),
        H(key('G'), 'Grid Snap', s.Grid ? 'g' : ''),
        ...tail];
}

function drawObject() {
    const sel = s.Sel, poor = s.Placing && s.Need !== undefined && s.Have < s.Need;
    $('object').classList.toggle('hidden', !sel && !warnTimer);
    ['oname', 'transform', 'reqs'].forEach(id => $(id).classList.toggle('hidden', !sel));
    if (sel) {
        $('oname').textContent = title(sel.Label) + (s.Multi > 1 ? ` (+${s.Multi - 1})` : '');
        if (!$('transform').contains(document.activeElement)) $('transform').innerHTML = ['Pos', 'Rot'].map(T => {
            const v = sel[T], d = T === 'Pos' ? 3 : 2;
            return `<div class="head"><span>${T === 'Pos' ? 'Position' : 'Rotation'}</span><span class="acts"><span onclick="copyPart('${T}')">Copy</span>`
                + (clip[T] ? `<span onclick="pastePart('${T}')">Paste</span>` : '') + `</span></div><div class="axes">`
                + ['x', 'y', 'z'].map(a => `<div class="axis"><b class="${a}">${T === 'Rot' ? 'R' : ''}${a.toUpperCase()}</b>`
                    + `<input type="number" step="${T === 'Pos' ? 0.01 : 1}" data-t="${T}" data-a="${a}" value="${num(v[a], d)}">`
                    + `<div class="mini" onclick="copyValue('${T}','${a}')">Copy</div></div>`).join('') + '</div>';
        }).join('');
        $('reqs').innerHTML = s.Placing && s.Need !== undefined
            ? `<div class="head"><span>Object Requirements</span></div><div class="row"><span>Bank</span><span class="${poor ? 'bad' : ''}">${money(Math.max(0, s.Have))}/${money(s.Need)}</span></div>` : '';
    }
    if (!warnTimer) {
        $('warn').classList.toggle('hidden', !poor);
        if (poor) $('warntext').textContent = 'Not Enough Money: You do not have enough to build this object.';
    }
}

function render() {
    drawCats();
    $('address').textContent = s.Address || '';
    $('limit').textContent = `${String(s.Placed ?? 0).padStart(3, '0')}/${s.Max ?? 0}`;
    $('limitbar').style.width = Math.min(100, (s.Placed ?? 0) / (s.Max || 1) * 100) + '%';
    const st = s.Stats || {};
    $('stats').innerHTML = `<div class="stat" title="Storage crates">${svg('crate')}<span>${st.Crates ?? 0}/${st.MaxCrates ?? 0}</span></div>`
        + `<div class="stat" title="Wardrobes">${svg('hanger')}<span>${st.Wardrobes ?? 0}</span></div>`
        + `<div class="stat" title="Walls">${svg('brick')}<span>${st.Walls ?? 0}</span></div>`;
    $('unsaved').classList.toggle('hidden', !s.Dirty);
    $('shop').classList.toggle('hidden', !s.Shop);
    drawObject();
    $('hints').innerHTML = `<div class="modes"><div class="${s.Adv ? '' : 'on'}" onclick="post('key',{K:'basic'})">${key(1)}Basic</div><div class="${s.Adv ? 'on' : ''}" onclick="post('key',{K:'advanced'})">${key(2)}Advanced</div></div>` + hintRows().join('');
    if (group === -2) drawGrid();
    if (!s.Sel) hide('options');
}

// // Copy / paste: position and rotation separately, or one axis (also to the system clipboard, as text) \\
function toClipboard(text) {
    const ta = $('clipboard');
    ta.value = text; ta.select(); document.execCommand('copy'); ta.blur();
    warn('Copied: ' + text);
}
const vec = (v, d) => `vector3(${num(v.x, d)}, ${num(v.y, d)}, ${num(v.z, d)})`;
function copyPart(T) {
    if (!s.Sel) return;
    clip[T] = { ...s.Sel[T] };
    toClipboard(vec(s.Sel[T], T === 'Pos' ? 3 : 2));
    drawObject();
}
function copyValue(T, a) { if (s.Sel) toClipboard(num(s.Sel[T][a], T === 'Pos' ? 3 : 2)); }
function setTransform(T, v) { if (s.Sel) post('set', { Pos: { ...s.Sel.Pos }, Rot: { ...s.Sel.Rot }, [T]: v }); }
function pastePart(T) { if (clip[T]) setTransform(T, { ...clip[T] }); }
function copyTransform() { if (!s.Sel) return; clip = { Pos: { ...s.Sel.Pos }, Rot: { ...s.Sel.Rot } }; toClipboard(vec(s.Sel.Pos, 3) + ', ' + vec(s.Sel.Rot, 2)); drawObject(); }
function pasteTransform() { if (clip.Pos && clip.Rot && s.Sel) post('set', { Pos: { ...clip.Pos }, Rot: { ...clip.Rot } }); }
$('transform').addEventListener('change', e => {
    const i = e.target, T = i.dataset.t;
    if (T) setTransform(T, { ...s.Sel[T], [i.dataset.a]: parseFloat(i.value) || 0 });
});
$('transform').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

// // Options menu (right click) \\
const PRESETS = { Door: { X: 0, Z: 0, W: 1, H: 2.25 }, Window: { X: 0, Z: 1, W: 1, H: 1 } };
const wallCopy = () => JSON.parse(JSON.stringify(s.Sel.Wall));
const opt = (text, fn, cls = '', right = '') => `<div class="opt ${cls}" onclick="${fn}">${text}<span>${right}</span></div>`;
const field = (lbl, attrs, val, cls = '') => `<div class="kv"><label class="${cls}">${lbl}</label><input type="number" ${attrs} value="${val}"></div>`;
const reopen = "setTimeout(()=>openOptions(),60)";

function openOptions(x, y) {
    const sel = s.Sel, o = $('options');
    if (!sel) return;
    let html = `<div class="head">${esc(title(sel.Label))}</div>`;
    if (sel.Tintable) {
        html += '<div class="sub">Colour</div><div class="swatches">' + colors.map((c, i) =>
            `<div class="${sel.Tint === i ? 'on' : ''}" style="background:${c}" onclick="post('tint',{Value:${i}}).then(()=>${reopen})"></div>`).join('') + '</div>';
    }
    html += opt('Duplicate', "act('duplicate')") + opt('Place On Ground', "act('ground')") + opt('Reset Rotation', "act('reset')")
        + (sel.Tintable ? '' : opt('Tint', `post('key',{K:'tint'}).then(()=>${reopen})`, '', `${sel.Tint + 1}/16`))
        + opt('Copy Position', "copyPart('Pos');hide('options')") + opt('Copy Rotation', "copyPart('Rot');hide('options')")
        + (clip.Pos ? opt('Paste Position', "pastePart('Pos');hide('options')") : '') + (clip.Rot ? opt('Paste Rotation', "pastePart('Rot');hide('options')") : '');
    if (s.Adv) {
        html += '<div class="sub">Position</div>' + ['x', 'y', 'z'].map(a => field(a + ' pos', `data-t="Pos.${a}" step="0.01"`, num(sel.Pos[a], 3), a)).join('')
            + '<div class="sub">Rotation</div>' + ['x', 'y', 'z'].map(a => field(a + ' rot', `data-t="Rot.${a}" step="1"`, num(sel.Rot[a], 1), a)).join('');
    }
    if (sel.Wall) {
        html += '<div class="sub">Wall · steps of 0.25m</div>' + field('Length', 'data-w="L" step="0.25"', sel.Wall.L) + field('Height', 'data-w="H" step="0.25"', sel.Wall.H)
            + sel.Wall.Holes.map((h, i) => `<div class="hole">${opt(`Hole ${i + 1}`, `wallEdit(w=>w.Holes.splice(${i},1))`, 'r', '✕')}`
                + [['X', 'Offset'], ['Z', 'Bottom'], ['W', 'Width'], ['H', 'Height']].map(([k, l]) => field(l, `data-h="${i}" data-f="${k}" step="0.25"`, h[k])).join('') + '</div>').join('')
            + opt('+ Door Hole', "wallEdit(w=>w.Holes.push({...PRESETS.Door}))") + opt('+ Window Hole', "wallEdit(w=>w.Holes.push({...PRESETS.Window}))");
    }
    o.innerHTML = html + opt('Delete', "act('key',{K:'delete'})", 'r');
    if (x !== undefined) { o.dataset.x = x; o.dataset.y = y; }
    o.style.display = 'flex';
    o.style.left = Math.min(+o.dataset.x, innerWidth - o.offsetWidth - 8) + 'px';
    o.style.top = Math.min(+o.dataset.y, innerHeight - o.offsetHeight - 8) + 'px';
}
function act(name, data) { hide('options'); post(name, data); }
function wallEdit(fn) { const w = wallCopy(); fn(w); post('wall', w).then(() => setTimeout(() => openOptions(), 80)); }
$('options').addEventListener('change', e => {
    const i = e.target, v = parseFloat(i.value) || 0;
    if (i.dataset.t) {
        const t = { Pos: { ...s.Sel.Pos }, Rot: { ...s.Sel.Rot } }, [a, b] = i.dataset.t.split('.');
        t[a][b] = v; post('set', t);
    } else wallEdit(w => i.dataset.w ? w[i.dataset.w] = v : w.Holes[i.dataset.h][i.dataset.f] = v);
});

// // Mouse / keys \\
const view = $('view');
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('mousedown', e => {
    document.activeElement.blur(); hide('options');
    if (e.button === 0) { lmb = true; post('down', { Ctrl: e.ctrlKey }); }
    if (e.button === 2) { rmb = true; rmbMoved = false; }
});
addEventListener('mouseup', e => {
    if (e.button === 0 && lmb) { lmb = false; post('up'); }
    if (e.button === 2 && rmb) {
        rmb = false;
        if (!rmbMoved) post('options').then(r => setTimeout(() => r && r.Open && openOptions(e.clientX, e.clientY), 30));
    }
});
addEventListener('mousemove', e => {
    if (!rmb) return;
    if (Math.abs(e.movementX) + Math.abs(e.movementY) > 1) rmbMoved = true;
    look[0] += e.movementX; look[1] += e.movementY;
    if (!busy) { busy = true; const [dx, dy] = look; look = [0, 0]; post('look', { dx, dy }).finally(() => busy = false); }
});
view.addEventListener('wheel', e => post('wheel', { d: e.deltaY, Ctrl: e.ctrlKey, Alt: e.altKey }), { passive: true });
const typing = e => e.target.tagName === 'INPUT';
document.addEventListener('focusin', e => typing(e) && post('typing', { State: true }));
document.addEventListener('focusout', e => typing(e) && post('typing', { State: false }));

function askClose() { if (s.Dirty) $('modal').style.display = 'flex'; else post('close'); }

const KEYS = { 1: 'basic', 2: 'advanced', r: 'axis', g: 'grid', y: 'tint', l: 'link', m: 'shop', delete: 'delete' };
addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if ($('modal').style.display === 'flex') hide('modal');
        else if ($('options').style.display === 'flex') hide('options');
        else if (s.Placing || s.Sel) { picked = null; post('key', { K: 'cancel' }); document.querySelectorAll('.tile.on').forEach(x => x.classList.remove('on')); }
        else askClose();
        return;
    }
    if (document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (e.altKey) e.preventDefault();
    if (e.ctrlKey) {
        if (k === 'c') return copyTransform();
        if (k === 'v') return pasteTransform();
        const c = { z: 'undo', y: 'redo', s: 'save' }[k];
        if (c) { e.preventDefault(); post('key', { K: c }); }
        return;
    }
    if (KEYS[k]) post('key', { K: KEYS[k] });
});

addEventListener('message', ({ data: m }) => {
    if (m.Action === 'Open') {
        catalog = m.Data.Catalog || []; groups = m.Data.Groups || []; colors = m.Data.Colors || []; thumb = m.Data.Thumb || '';
        if (m.Data.Entities) entities = m.Data.Entities;
        s = { List: [], Address: m.Data.Address }; group = -1; picked = null;
        $('search').value = ''; hide('modal'); hide('options');
        document.body.style.display = 'block'; drawCats(); drawGrid();
    } else if (m.Action === 'State') { s = { ...m.Data, Address: s.Address }; s.List = s.List || []; render(); }
    else if (m.Action === 'Warn') warn(m.Text);
    else if (m.Action === 'Close') { document.body.style.display = 'none'; lmb = rmb = false; }
});
</script>
</body>
</html>
