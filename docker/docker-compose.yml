version: '3.9'

services:
  mariadb:
    image: mariadb:11
    container_name: fivem-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: aaa
      MYSQL_DATABASE: fivem
      MYSQL_USER: fivem
      MYSQL_PASSWORD: aaa
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: